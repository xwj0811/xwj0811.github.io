<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="向伟静的个人主页：关注人的体验，探索交互的可能性。">
<title>向伟静 · 人因与体验设计</title>
<style>
/* Weijing Xiang — personal site. White pages with blue used for emphasis.
   Type (iteration 014; iteration 069 moved each size up one step of the Chinese size ladder, no more): four sizes, written in pt —
   15 title (小三) / 10.5 sub-heading (五号) / 9 text (小五) / 6.5 dates and numbers (小六); 20 / 14 / 12 / 8.7 px on screen.
   Phones, also one step up from their earlier values: 15 / 12 / 10.5 / 9 pt. Every font-size goes through these tokens; components must not set their own sizes.
   Titles (page titles, section headings, the first-screen sentence) are serif and semi-bold; sub-headings (organisation, work
   and block names) are serif at regular weight; everything else is sans-serif at 400, with 500 for the few emphasised labels.
   The older role names (display, h1, h2, stat, take, h3, lead, body, small, label, micro) are kept and mapped onto the four sizes. */
:root{--bg:#fff;--tint:#f3f8fb;--tint2:#e6f0f6;--ink:#1b3a54;--text:#2c3b49;--muted:#5e6b77;--line:#d8e3ea;--brand:#1f6f9c;--brand-strong:#17587d;--brand-soft:#dcebf3;--warm:#c05a30;--warm-soft:#f8e6dc;--white:#fff;--orange:#1f6f9c;--wash:#f3f8fb;--paper:#fff;
  --font:"Inter","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC","Source Han Serif SC","Source Han Serif CN","Songti SC","STSong",Georgia,"SimSun",serif;
  --fs-title:15pt;--fs-sub:10.5pt;--fs-text:9pt;--fs-meta:6.5pt;--fw-title:600;
  --fs-display:var(--fs-title);--fs-h1:var(--fs-title);--fs-h2:var(--fs-title);--fs-stat:var(--fs-title);--fs-take:var(--fs-sub);--fs-h3:var(--fs-sub);--fs-lead:var(--fs-sub);--fs-body:var(--fs-text);--fs-small:var(--fs-text);--fs-label:var(--fs-text);--fs-micro:var(--fs-text);--fw-display:400;--fw-head:400;--fw-strong:500;--warm-text:#a2461f;--r:14px;--r-s:8px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-body);line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}button,a{touch-action:manipulation}
a{color:inherit;text-decoration:none}
h1,h2,h3{color:var(--ink);margin:0;line-height:1.4;letter-spacing:0}h1,h2,h3,h4{font-family:var(--serif)}h1,h2{font-size:var(--fs-title);font-weight:var(--fw-title)}h3,h4{font-size:var(--fs-sub);font-weight:400}strong,b{font-weight:var(--fw-strong)}
p{margin:0}
svg text{font-family:var(--font)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:4px}
::selection{background:#bfdcea}
.skip{position:fixed;top:-100px;left:12px;background:var(--ink);color:#fff;padding:10px 14px;z-index:50;border-radius:var(--r-s)}.skip:focus{top:12px}
.wrap{max-width:1240px;margin:auto;padding:0 56px}
.band{background:var(--tint);box-shadow:0 0 0 100vmax var(--tint);clip-path:inset(0 -100vmax)}
.num{font-size:var(--fs-label);font-weight:var(--fw-strong);color:var(--brand);font-variant-numeric:tabular-nums}
.kicker{font-size:var(--fs-micro);font-weight:var(--fw-strong);letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:12px}

/* Navigation */
.nav{min-height:84px;display:flex;justify-content:space-between;align-items:center;gap:24px;border-bottom:1px solid var(--line)}
.brand{font-size:var(--fs-h3);font-weight:var(--fw-strong);color:var(--ink);line-height:1.3}
.brand span{display:block;font-size:var(--fs-micro);font-weight:400;letter-spacing:.14em;color:var(--muted);margin-top:2px}
.navright{display:flex;align-items:center;gap:30px}
.navlinks .navlabel{font-family:var(--sub);font-size:var(--fs-sub);font-weight:400;cursor:default}
.navlinks{display:flex;gap:30px;font-size:var(--fs-small);color:var(--ink)}
.navlinks a,.navlinks .navlabel{padding:6px 0}.navlinks a:hover{color:var(--brand)}
.langswitch{display:inline-flex;border:1px solid var(--line);border-radius:30px;padding:2px;background:#fff;flex-shrink:0}
.langswitch button{border:0;background:none;color:var(--muted);font-size:var(--fs-label);line-height:1;padding:8px 12px;border-radius:30px;min-width:40px}
.langswitch button[aria-pressed=true]{background:var(--brand);color:#fff}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:56px;padding:72px 0 80px}
.identity{display:flex;align-items:center;gap:16px;margin-bottom:34px}
.portrait{width:82px;height:96px;border:3px solid #fff;box-shadow:0 4px 22px #16324a22;background:var(--tint2);border-radius:10px;overflow:hidden;position:relative;display:grid;place-items:center;flex-shrink:0}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait span{text-align:center;font-size:var(--fs-h3);color:var(--muted)}.portrait small{display:block;font-size:var(--fs-micro)}
.identity strong{display:block;font-size:var(--fs-lead);font-weight:var(--fw-strong);color:var(--ink)}
.identity p{font-size:var(--fs-label);letter-spacing:.04em;color:var(--muted)}
.eyebrow{font-size:var(--fs-micro);font-weight:var(--fw-strong);letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.hero h1{font-size:var(--fs-display);line-height:1.45;margin:14px 0 20px;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--brand)}
.intro{font-size:var(--fs-lead);line-height:1.85;max-width:520px}
.actions{display:flex;flex-wrap:wrap;gap:16px 26px;align-items:center;margin-top:34px}
.primary{display:inline-flex;gap:18px;align-items:center;background:var(--brand);color:#fff;padding:14px 24px;font-size:var(--fs-body);font-weight:var(--fw-strong);border-radius:40px}
.primary:hover{background:var(--brand-strong)}
.textlink{font-size:var(--fs-body);color:var(--brand-strong);border-bottom:1px solid #9bc1d6;padding-bottom:3px}
.textlink:hover{border-color:var(--brand)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px}
.tag{font-size:var(--fs-label);color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:30px;padding:3px 13px}

/* Atlas (hero figure) */
.atlas{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px 0;background:#fff;overflow:hidden;min-width:0;box-shadow:0 10px 40px #1f6f9c14}
.atlas-top{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-micro);letter-spacing:.12em;color:var(--muted)}.atlas-top b{font-weight:400}
.atlas-stage{position:relative;aspect-ratio:1.35;min-height:340px;margin-top:8px}
.atlas-stage svg{width:100%;height:100%;position:absolute;inset:0}
.anatomy,.bodyfill{stroke:#5a8aa6;fill:none;stroke-width:1.3}.bodyfill{fill:url(#body-fill);stroke-width:1}
.neural{stroke:#4c86a6;stroke-width:1;fill:none;opacity:.6}
.brain{stroke:var(--brand);stroke-width:1.7;fill:#8dc5e022}.orbit{fill:none;stroke:#79a4bd;stroke-width:.7;opacity:.45}
.scanline{stroke:var(--brand);opacity:.2;animation:scan 6s ease-in-out infinite}.signal{fill:var(--brand)}
@keyframes scan{0%,100%{transform:translateY(-90px)}50%{transform:translateY(110px)}}
.hotspot{position:absolute;border:1px solid var(--line);background:#fffffff2;padding:10px 14px;text-align:left;border-radius:10px;color:var(--ink);min-width:132px;z-index:1;transition:transform .2s,box-shadow .2s,background .2s}
.hotspot:hover{transform:translateY(-2px);box-shadow:0 6px 18px #1f6f9c22}
.hotspot[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.hotspot small{display:block;font-size:var(--fs-micro);letter-spacing:.08em;opacity:.75}
.hotspot strong{font-size:var(--fs-body);font-weight:var(--fw-strong)}.hotspot .arrow{float:right;margin-left:14px}
.hs0{top:13%;left:1%}.hs1{top:29%;right:0}.hs2{top:57%;left:0}.hs3{bottom:8%;right:0}
.atlas[data-active="0"] .brain,.atlas[data-active="1"] .senses,.atlas[data-active="2"] .torso,.atlas[data-active="3"] .hands{stroke:var(--brand-strong);opacity:1;stroke-width:2}
.atlas-panel{border-top:1px solid var(--line);padding:18px 0 20px;min-height:150px}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.atlas-panel h3{font-size:var(--fs-lead)}
.atlas-panel p{font-size:var(--fs-small);line-height:1.75;margin:8px 0}
.atlas-panel small{font-size:var(--fs-label);color:var(--muted)}
.atlas-panel button{color:var(--brand-strong);border:0;background:none;font-size:var(--fs-small);font-weight:var(--fw-strong);white-space:nowrap}
.atlas-note{display:block;font-size:var(--fs-micro);color:var(--muted);margin-top:8px}

/* Sections */
.section{padding:72px 0}
.sectionhead{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:40px}
.sectionhead p{font-size:var(--fs-body);color:var(--muted);max-width:380px}.sectionhead p.wide{max-width:440px}
.strengths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 40px;padding:56px 0 0}
.strengthlead h2{font-size:var(--fs-h3)}
.strength{border-top:2px solid var(--brand);padding-top:18px}
.strength h3{margin:8px 0 10px}
.strength p{line-height:1.8}

/* Research path */
.pathline{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0 30px;position:relative}
.pathline:before{content:"";position:absolute;left:0;right:0;top:5px;height:1px;background:#bfd6e3}
.pathstep{position:relative;padding-top:32px;min-width:0}
.pathdot{position:absolute;top:0;left:0;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
.pathstep:last-child .pathdot{background:var(--brand)}
.pathstep small{font-size:var(--fs-label);font-weight:var(--fw-strong);letter-spacing:.06em;color:var(--brand)}
.pathstep h3{font-size:var(--fs-lead);margin:6px 0 8px}
.pathstep p{font-size:var(--fs-small);line-height:1.8}
.pathrefs{margin-top:10px}
.pathrefs a,.plink{display:block;width:fit-content;font-size:var(--fs-small);font-weight:var(--fw-strong);color:var(--brand-strong);border-bottom:1px solid #9bc1d6;padding-bottom:2px;margin-top:8px}
.pathrefs a:hover,.plink:hover{border-color:var(--brand)}

/* Projects */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.filter,.seg button{padding:7px 16px;border:1px solid var(--line);border-radius:30px;background:#fff;color:var(--text);font-size:var(--fs-small)}
.filter[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.filter-result{font-size:var(--fs-label);color:var(--muted);margin:0 0 22px}
.projectgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 30px}
.project{min-width:0}.project[hidden]{display:none}
.projectvisual{height:230px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.projectvisual svg{width:100%;height:100%;transition:transform .4s}.project:hover .projectvisual svg{transform:scale(1.03)}
.projectvisual img.cover{width:100%;height:100%;object-fit:cover;display:block}
.pnumber{position:absolute;top:14px;left:16px;font-size:var(--fs-label);font-weight:var(--fw-strong);color:var(--brand);z-index:1}
.visualnote{position:absolute;bottom:10px;right:14px;font-size:var(--fs-micro);color:var(--muted)}
.projectmeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-top:18px;font-size:var(--fs-label);color:var(--muted)}
.status{color:var(--brand-strong);font-weight:var(--fw-strong)}
.project h3{margin:8px 0 8px;line-height:1.45}.project h3 a:hover{color:var(--brand)}
.project p{font-size:var(--fs-small);line-height:1.8}
.plink{margin-top:14px}
.empty-state{padding:30px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:var(--fs-small);grid-column:1/-1}

/* Knowledge tree */
.tree{display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:44px;align-items:start}
.tree-root{position:relative;background:var(--brand);color:#fff;border-radius:var(--r);padding:20px 22px}
.tree-root small{display:block;font-size:var(--fs-micro);letter-spacing:.14em;opacity:.8}
.tree-root strong{display:block;font-size:var(--fs-h3);font-weight:var(--fw-strong);margin:6px 0}
.tree-root span{display:block;font-size:var(--fs-label);line-height:1.6;opacity:.9}
.tree-root:after{content:"";position:absolute;left:100%;top:40px;width:44px;height:2px;background:#9bc1d6}
.branch{position:relative;display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 26px;padding:24px 0 28px 44px}
.branch:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:#9bc1d6}
.branch:first-child:before{top:40px}.branch:last-child:before{bottom:auto;height:41px}.branch:only-child:before{display:none}
.branch:after{content:"";position:absolute;left:0;top:40px;width:28px;height:2px;background:#9bc1d6}
.branch-head{display:flex;gap:12px;align-items:baseline}
.branch-head h3{line-height:32px}
.branch-head small{display:block;font-size:var(--fs-micro);letter-spacing:.12em;color:var(--muted)}
.branch-body p{font-size:var(--fs-body);line-height:32px;margin:0 0 10px}
.leaves{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.leaves li>*{display:inline-block;font-size:var(--fs-small);line-height:1.5;padding:6px 14px;border-radius:30px;border:1px dashed #a9c6d6;color:var(--text)}
.leaves a{border-style:solid;border-color:var(--brand);color:var(--brand-strong);font-weight:var(--fw-strong);background:#fff}
.leaves a:hover{background:var(--brand);color:#fff}
.tree-legend{display:flex;gap:8px 24px;flex-wrap:wrap;font-size:var(--fs-label);color:var(--muted);margin:0}
.tree-legend i{display:inline-block;width:24px;height:11px;border-radius:10px;border:1px dashed #a9c6d6;margin-right:8px;vertical-align:-1px}
.tree-legend i.on{border:1px solid var(--brand);background:#fff}

/* Methods, notes, life, explore, about */
.methods{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:64px}
.methodintro p{margin-top:16px;color:var(--muted)}
.methodrow{display:grid;grid-template-columns:36px 230px minmax(0,1fr);gap:14px;padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline}
.methodrow:first-child{padding-top:0}
.methodrow h3{font-size:var(--fs-lead)}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
.note{padding:22px 0;border-top:1px solid var(--line);display:flex;gap:18px;align-items:baseline}
.note h3{font-size:var(--fs-lead);margin-bottom:6px}.note a{color:var(--brand-strong)}.note a:hover{color:var(--brand)}
.note p{font-size:var(--fs-label);color:var(--muted)}
.note .desc{font-size:var(--fs-small);color:var(--text);margin-bottom:6px}
.lifegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 28px}
.lifegrid[hidden],.lifepending[hidden]{display:none}
.lifegrid:not([hidden])+.lifepending{margin-top:44px}
.lifeitem{margin:0;min-width:0}.lifeitem[hidden]{display:none}
.lifeimg{display:block;width:100%;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;border:0;padding:0;background:var(--tint2);cursor:zoom-in}
.lifeimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.lifeimg:hover img{transform:scale(1.04)}
.lifeitem figcaption{margin-top:14px}
.lifeitem small{font-size:var(--fs-label);font-weight:var(--fw-strong);color:var(--brand)}
.lifeitem strong{display:block;font-size:var(--fs-lead);font-weight:var(--fw-strong);color:var(--ink);margin:2px 0 4px}
.lifeitem p{font-size:var(--fs-small);line-height:1.75}
.lifeitem a{display:inline-block;font-size:var(--fs-small);margin-top:8px;color:var(--brand-strong);border-bottom:1px solid #9bc1d6}
.pendinghead{font-size:var(--fs-label);color:var(--muted);margin:0 0 14px}
.pendinggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}
.pendingitem{display:flex;gap:16px;align-items:flex-start;padding:18px;border:1px dashed #a9c6d6;border-radius:var(--r);background:#fff}
.pendingicon{flex:0 0 56px;height:56px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--tint2)}
.pendingicon svg{width:34px;height:auto;opacity:.8}
.explore{padding:44px 48px;background:var(--brand);color:#fff;border-radius:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:60px}
.explore h2,.explore h3{color:#fff}.explore .kicker{color:#cfe6f2}
.explore p{font-size:var(--fs-small);line-height:1.85;color:#e3f0f7}
.explore>div:first-child p{margin:14px 0 20px}
.explore .textlink{color:#fff;border-color:#ffffff88}
.question{padding:18px 0;border-bottom:1px solid #ffffff3d}.question:first-child{padding-top:0}.question:last-child{border-bottom:0}
.question h3{font-size:var(--fs-lead);margin-bottom:6px}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:72px}
.about p{white-space:pre-line}
.about .path{font-size:var(--fs-small);font-weight:var(--fw-strong);line-height:2;color:var(--brand);margin-top:20px}
.contact{margin-top:24px}
.contact a{display:inline-block;margin:0 20px 10px 0;font-weight:var(--fw-strong);color:var(--brand-strong);border-bottom:1px solid #9bc1d6}
.footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:26px 0 90px;font-size:var(--fs-label);color:var(--muted);border-top:1px solid var(--line)}

/* Project pages */
.ppage{padding:0 0 90px}
.pp-top{padding:30px 0 56px}
.pp-back{display:inline-block;font-size:var(--fs-small);color:var(--brand-strong);border-bottom:1px solid #9bc1d6}
.pp-head{padding-top:34px;max-width:940px}
.pp-meta{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:var(--fs-small);color:var(--muted)}
.pp-head h1{font-size:var(--fs-h1);margin:14px 0 16px}.pp-head h1:focus,.pp-head h1:focus-visible{outline:none}
.pp-summary{font-size:var(--fs-lead);line-height:1.85;max-width:780px}
.pp-take{margin-top:34px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:start}
.pp-take blockquote{margin:0;padding:4px 0 4px 22px;border-left:4px solid var(--brand);font-size:var(--fs-take);line-height:1.7;font-weight:var(--fw-strong);color:var(--ink)}
.pp-take blockquote small{display:block;font-size:var(--fs-micro);letter-spacing:.14em;color:var(--brand);font-weight:var(--fw-strong);margin-bottom:8px}
.pp-facts{margin:0;display:grid;gap:0}
.pp-facts div{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:var(--fs-small);line-height:1.7}
.pp-facts dt{color:var(--muted)}.pp-facts dd{margin:0;color:var(--ink)}
.pp-cover{height:400px;margin-top:56px}
.pp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 64px;margin-top:64px;border-top:1px solid var(--line)}
.pp-sec{padding:30px 0;border-bottom:1px solid var(--line)}
.pp-sec h2{font-size:var(--fs-label);letter-spacing:.1em;color:var(--brand);margin-bottom:10px}
.pp-sec p{white-space:pre-line}
.pp-link{margin-top:30px}
.pp-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:72px;padding-top:26px;border-top:1px solid var(--line)}
.pp-nav a{font-size:var(--fs-lead);font-weight:var(--fw-strong);color:var(--ink);line-height:1.5}.pp-nav a:last-child{text-align:right}.pp-nav a:hover{color:var(--brand)}
.pp-nav small{display:block;font-size:var(--fs-label);font-weight:400;color:var(--muted);margin-bottom:4px}

/* Case modules */
.case-note{font-size:var(--fs-label);line-height:1.7;color:var(--muted);margin-top:22px;max-width:820px}
.cmod{padding:60px 0}
.ppage>.cmod:nth-of-type(even){background:var(--tint);box-shadow:0 0 0 100vmax var(--tint);clip-path:inset(0 -100vmax)}
.cmod-head{display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 8px;margin-bottom:32px}
.cmod-head .num{padding-top:12px}
.cmod-head h2{margin-bottom:10px}
.cmod-head p{line-height:1.8;max-width:780px}
.cmod-foot{font-size:var(--fs-small);line-height:1.7;color:var(--muted);margin-top:20px;max-width:860px}
.cmod h3.sub{margin:40px 0 16px}
.cgrid{display:grid;gap:36px 48px;align-items:center}
.cgrid figure,.calc-out,.chartbox,.panel{margin:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.cgrid figcaption{font-size:var(--fs-small);line-height:1.7;color:var(--muted);margin-top:10px}
.cfig{display:block;width:100%;height:auto}
.mcap{font-size:12px;fill:#5d7385}.xl{font-size:13px;fill:#16324a}.mval,.pv{font-size:13px;font-weight:var(--fw-strong);fill:#17587d}
.take{font-size:var(--fs-lead);line-height:1.75;font-weight:var(--fw-strong);color:var(--ink);border-left:4px solid var(--brand);padding-left:16px;margin:4px 0 16px}
.decision{margin-top:24px;padding:18px 24px;border-radius:0 var(--r-s) var(--r-s) 0;background:var(--tint2);color:var(--ink);border-left:2px solid var(--brand)}
.decision small{display:block;font-size:var(--fs-micro);letter-spacing:.14em;font-weight:var(--fw-strong);opacity:.85;margin-bottom:6px}
.decision p{line-height:1.8}
.obs{margin:0;padding:0 0 0 20px}.obs li{margin-bottom:8px}
.obs.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px;margin-top:26px}
.chips,.bcol ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{font-size:var(--fs-small);padding:6px 14px;border-radius:30px;border:1px dashed #a9c6d6}
.chips.col{flex-direction:column;align-items:flex-start}.chips.col li{border-radius:var(--r-s);line-height:1.7;border-style:solid;border-color:var(--line);background:#fff}
.cards{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card .num{display:block;margin-bottom:6px}
.card h3{margin-bottom:8px}
.card p{line-height:1.75}
.card small{display:block;font-size:var(--fs-label);color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--line);line-height:1.7}
.card.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--fs-small);line-height:1.65}
th,td{text-align:left;padding:12px 16px 12px 0;border-bottom:1px solid var(--line);vertical-align:top;font-weight:400}
thead th{font-size:var(--fs-label);color:var(--muted)}
tbody th{font-weight:var(--fw-strong);color:var(--ink)}
.exps{min-width:760px}.tscroll table.wide{min-width:700px}.exps tbody th{color:var(--brand);white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.calc-ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 40px;margin-bottom:24px}
.calc-ctl label,.ctl-label{display:block;font-size:var(--fs-label);color:var(--muted);margin-bottom:8px}
.sliders{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 30px}
.sliders label{margin:0}.sliders output,.ctl-label output{color:var(--brand-strong);font-weight:var(--fw-strong);margin-left:6px}
input[type=range]{display:block;width:100%;margin-top:8px;accent-color:var(--brand)}

/* Compatibility case */
.why{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.whylist,.ladder,.steps{list-style:none;margin:0;padding:0}
.whylist li,.ladder li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:0 8px;padding:14px 0;border-bottom:1px solid var(--line)}
.whylist li:first-child{padding-top:0}
.whylist strong,.ladder strong{font-weight:var(--fw-strong);color:var(--ink)}
.whylist p,.ladder p{font-size:var(--fs-small);color:var(--muted)}
.pipe{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.pipe li{position:relative;padding:22px 18px 6px 0;border-top:2px solid var(--brand-soft)}
.pipe li:before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--brand)}
.pipe strong{display:block;font-weight:var(--fw-strong);color:var(--ink);margin:4px 0}
.pipe p{font-size:var(--fs-small);line-height:1.7}
.pipe em{display:block;font-style:normal;font-size:var(--fs-label);color:var(--brand-strong);margin-top:8px}
.map{grid-template-columns:minmax(0,.9fr) minmax(0,1fr);align-items:start}
.mapfig [data-m]{stroke:#7fa3b8;stroke-width:2;opacity:.5;transition:opacity .2s}
.mapfig[data-active="a"] [data-m="a"],.mapfig[data-active="b"] [data-m="b"],.mapfig[data-active="c"] [data-m="c"],.mapfig[data-active="d"] [data-m="d"],.mapfig[data-active="e"] [data-m="e"],.mapfig[data-active="f"] [data-m="f"]{stroke:#1f6f9c;stroke-width:2.8;opacity:1}
.mtag circle{fill:#fff;stroke-width:1.4}.mtag text{font-size:12px;font-weight:var(--fw-strong);fill:#16324a;stroke:none}
.mapkeys{display:grid;gap:6px}
.mapkeys button{display:grid;grid-template-columns:28px minmax(0,1fr) 18px minmax(0,1fr);align-items:center;gap:6px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:10px 14px;font-size:var(--fs-small);line-height:1.5;color:var(--ink)}
.mapkeys button i{font-style:normal;font-size:var(--fs-label);font-weight:var(--fw-strong);width:22px;height:22px;border-radius:50%;border:1px solid #9bc1d6;display:grid;place-items:center;color:var(--brand-strong)}
.mapkeys button b{font-weight:var(--fw-strong);color:var(--brand-strong)}.mapkeys button span{color:#9bc1d6}
.mapkeys button[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);background:var(--tint)}
.mapkeys button[aria-pressed=true] i{background:var(--brand);color:#fff;border-color:var(--brand)}
.mapcard{margin:16px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;padding:20px;border-radius:var(--r);background:var(--tint2)}
.mapcard .wide{grid-column:1/-1}
.mapcard dt{font-size:var(--fs-label);color:var(--muted)}
.mapcard dd{margin:0;font-size:var(--fs-small);line-height:1.7;color:var(--ink)}
.mapcard em,.badge{font-style:normal;display:inline-block;background:var(--brand);color:#fff;border-radius:30px;padding:1px 12px;font-size:var(--fs-label);font-weight:var(--fw-strong)}
.calc{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:30px 44px;align-items:start}
.calc-read{display:flex;flex-wrap:wrap;gap:10px 36px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.calc-read small{display:block;font-size:var(--fs-label);color:var(--muted)}
.calc-read strong{font-size:var(--fs-stat);font-weight:var(--fw-strong);color:var(--ink);line-height:1.3}
.calc-read strong:after{content:" mm";font-size:var(--fs-label);color:var(--muted);font-weight:400}
.calc-read .warm strong{color:var(--warm)}
.calc-side h3{margin:4px 0 16px}
.calc-side p,.limits p{line-height:1.8;margin-top:16px}
.spanbars,.joint,.bars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.spanbars li,.joint li,.bars li{display:grid;grid-template-columns:76px minmax(0,1fr) 72px;align-items:center;gap:10px;font-size:var(--fs-small);color:var(--muted)}
.spanbars i,.joint i,.bars i{display:block;height:10px;border-radius:10px;background:#b9d5e3}
.spanbars li.on{color:var(--ink);font-weight:var(--fw-strong)}.spanbars li.on i,.bars i.on{background:var(--brand)}
.spanbars b,.joint b,.bars b{font-weight:var(--fw-strong);text-align:right;color:var(--ink)}
.spanbars b:after{content:" mm";font-weight:400;color:var(--muted);font-size:var(--fs-micro)}
.joint li.warm i{background:linear-gradient(90deg,#d98a68 90%,#f3cfbf 90%)}
.wear{grid-template-columns:minmax(0,.9fr) minmax(0,1fr)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.bcol{border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:var(--r);padding:22px;background:#fff}
.bcol.b1{border-top-color:var(--brand)}.bcol.b2{border-top-color:#9bc1d6}
.bcol h3{margin-bottom:4px}.bcol small{font-size:var(--fs-label);color:var(--muted)}
.bcol ul{margin-top:16px}.bcol li{font-size:var(--fs-small);padding:5px 13px;border-radius:30px;background:var(--tint2);color:var(--ink)}
.dofs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.dofs li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.dofs svg{width:64px;height:auto}.dofs strong{font-weight:var(--fw-strong);color:var(--ink);font-size:var(--fs-small)}
.dofs p{font-size:var(--fs-label);line-height:1.65;color:var(--muted)}
.limits{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.limits h3.sub:first-child,.limits>div>h3.sub:first-child{margin-top:0}
.ladder li{grid-template-columns:36px minmax(0,1fr) auto;align-items:start}
.ladder em,.hyps em,.tagpill{font-style:normal;font-size:var(--fs-label);font-weight:var(--fw-strong);border-radius:30px;padding:3px 13px;white-space:nowrap}
.ladder .ok em,.hyps em.yes{background:var(--brand);color:#fff}.ladder .mid em{background:var(--brand-soft);color:var(--brand-strong)}.ladder .todo em{border:1px dashed #a9c6d6;color:var(--muted)}

/* Aesthetics case */
.fw{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:18px;align-items:center}
.fwcol{display:grid;gap:14px}
.fwmid{display:flex;align-items:center;gap:14px;color:var(--brand);font-size:var(--fs-take)}
.fwbox{border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;background:#fff;font-size:var(--fs-small)}
.fwbox small{display:block;font-size:var(--fs-label);color:var(--muted)}
.fwbox strong{display:block;font-size:var(--fs-lead);font-weight:var(--fw-strong);color:var(--ink)}
.fwbox p{line-height:1.75;margin-top:4px}
.fwbox em{display:inline-block;font-style:normal;font-size:var(--fs-label);font-weight:var(--fw-strong);color:var(--brand-strong);background:var(--brand-soft);border-radius:30px;padding:1px 11px;margin:6px 0 4px}
.fwbox.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.fwbox.dashed{border-style:dashed;box-shadow:none;min-width:200px}.fwbox.dashed strong{font-size:var(--fs-body);margin-top:6px}
.fwbox.out{background:var(--brand);border-color:var(--brand);color:#fff}.fwbox.out small,.fwbox.out strong{color:#fff}
.three{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;margin-top:30px}
.three figure{display:flex;flex-direction:column;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles svg{display:block;width:100%;height:auto;border-radius:6px}
.tiles small{display:block;text-align:center;font-size:var(--fs-label);line-height:1.5;color:var(--muted);margin-top:6px}
.trial{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.trial li{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:12px;font-size:var(--fs-small);padding:9px 14px;border-radius:var(--r-s);background:var(--tint2);color:var(--ink)}
.trial li:nth-child(2){background:var(--brand);color:#fff}
.trial b{font-size:var(--fs-label);font-weight:400;opacity:.85}
.chartrow{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
.chartrow.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.chartbox h3,.chartside h3{font-size:var(--fs-lead);margin-bottom:10px}
.legend{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:var(--fs-label);color:var(--muted)}
.legend i{display:inline-block;width:22px;margin-right:7px;vertical-align:middle}
.dwrap{margin-top:12px;font-size:var(--fs-label);color:var(--muted)}
.dwrap summary{cursor:pointer;color:var(--brand-strong);font-weight:var(--fw-strong)}
.dtable{margin-top:8px;font-size:var(--fs-label)}
.dtable th,.dtable td{text-align:right;padding:6px 0 6px 12px;white-space:nowrap}
.dtable tbody th,.dtable thead th:first-child{text-align:left;padding-left:0;font-weight:400;white-space:normal;color:var(--text)}
.dtable td span{color:var(--muted)}
.chartside small{font-size:var(--fs-label);color:var(--muted)}
.stat{display:grid;gap:6px;margin-top:10px;font-size:var(--fs-label);line-height:1.6}
.stat span{padding:6px 12px;border-radius:var(--r-s);background:var(--brand-soft);color:var(--brand-strong)}
.stat span.ns{background:none;border:1px dashed #a9c6d6;color:var(--muted)}
.stat sub,.stat sup{font-size:.72em}
.matrix td:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;background:var(--brand)}
.matrix td.none:before{background:none;border:1px dashed #5f7f93}
.matrix td.flip:before{background:linear-gradient(90deg,var(--brand) 50%,var(--warm) 50%)}
.matrix td.down:before{background:var(--warm)}
.diff td{white-space:nowrap}
.diff td i{display:inline-block;height:10px;border-radius:9px;background:var(--warm);vertical-align:middle;margin-right:8px;min-width:3px;max-width:60%}
.diff td i.neg{background:#5f7f93}.diff td b{font-weight:var(--fw-strong);color:var(--ink)}
.hyps{list-style:none;margin:0 0 26px;padding:0}
.hyps li{display:grid;grid-template-columns:70px minmax(0,1.1fr) auto minmax(0,1.3fr);gap:8px 24px;align-items:start;padding:22px 0;border-bottom:1px solid var(--line)}
.hyps p{line-height:1.8}.hyps p.h{font-size:var(--fs-body);color:var(--ink);font-weight:var(--fw-strong)}
.hyps em.part{background:var(--warm-soft);color:#8c3f1f}.hyps em.no{border:1px dashed var(--warm);color:var(--warm-text)}

/* First-use, agent, motion and healing cases */
.statrow{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:18px}
.statrow div{border-top:3px solid var(--brand);padding-top:14px}
.statrow strong{display:block;font-size:var(--fs-h1);font-weight:var(--fw-strong);color:var(--ink);line-height:1.2}
.statrow span{font-size:var(--fs-small);color:var(--muted)}
.stepper{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:start}
.steps{display:grid;gap:6px}
.steps button{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:9px 14px;font-size:var(--fs-small);color:var(--ink)}
.steps button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.steps button[aria-pressed=true] .num{color:#fff}
.stepcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 28px}
.stepcard h3{margin-bottom:16px}
.stepcard dl{margin:0;display:grid;gap:14px}
.stepcard dt{font-size:var(--fs-label);font-weight:var(--fw-strong);color:var(--brand)}
.stepcard dd{margin:2px 0 0;color:var(--ink)}
.rule{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.rule div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:left}
.rule strong{display:block;font-size:var(--fs-h1);line-height:1.2;color:var(--brand);font-weight:var(--fw-strong)}
.rule b{display:block;color:var(--ink);font-weight:var(--fw-strong);margin:6px 0 4px}
.rule p{line-height:1.75}
.flowrow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.flowrow>div{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;font-size:var(--fs-small);line-height:1.7}
.flowrow>div b{display:block;color:var(--ink);font-weight:var(--fw-strong);font-size:var(--fs-body)}
.flowrow>span{align-self:center;color:var(--brand);font-size:var(--fs-take)}
.flowrow>div.on{background:var(--brand);border-color:var(--brand);color:#fff}.flowrow>div.on b{color:#fff}
.tiers td:nth-child(2){color:var(--brand-strong)}.tiers .t0 th:before,.tiers .t1 th:before,.tiers .t2 th:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;background:var(--brand)}
.tiers .t1 th:before{background:#e0a23c}.tiers .t2 th:before{background:var(--warm)}
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}
.timeline li{position:relative;padding:24px 16px 0 0;border-top:2px solid var(--brand-soft)}
.timeline li:before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--brand)}
.timeline b{display:block;color:var(--ink);font-weight:var(--fw-strong)}
.timeline small{display:block;font-size:var(--fs-label);color:var(--brand-strong);font-weight:var(--fw-strong)}
.timeline p{font-size:var(--fs-small);line-height:1.7;margin-top:4px}
.mock{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 10px 36px #1f6f9c14}
.mockbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--tint);border-bottom:1px solid var(--line);font-size:var(--fs-label);color:var(--muted)}
.mockbody{padding:22px 24px;display:grid;gap:16px}
.mockbody .req{font-size:var(--fs-body);color:var(--ink);font-weight:var(--fw-strong);padding:12px 16px;background:var(--tint);border-radius:var(--r-s)}
.mockbody dl{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px 16px;line-height:1.75}
.mockbody dt{color:var(--brand);font-weight:var(--fw-strong)}.mockbody dd{margin:0;color:var(--ink)}
.mockbody .stop{border:1px dashed var(--warm);border-radius:var(--r-s);padding:14px 16px;color:#8c3f1f;background:var(--warm-soft);font-size:var(--fs-small);line-height:1.75}
.mockbody .stop b{display:block;font-size:var(--fs-body)}
/* ---- agent 案例页（迭代 043）：动效只用来解释变化，减少动画时关闭 ---- */
.agov{padding:6px 0 30px}
.agov dl{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 28px;border-top:1px solid var(--line)}
.agov dl>div{padding:14px 0 0}
.agov dt{font-size:var(--fs-label);color:var(--brand-strong)}
.agov dd{margin:4px 0 0;line-height:1.75}
.agstage{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.agstage li{font-size:var(--fs-label);padding:1px 10px;border-radius:30px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.agstage li.ok{border-color:#9bc1d6;color:var(--brand-strong);background:var(--brand-soft)}
.agstage i{font-style:normal;margin-right:4px}
.agjump{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.agquote{font-size:var(--fs-lead);color:var(--ink);padding:14px 18px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--warm);border-radius:var(--r-s);margin-bottom:22px;max-width:640px}
.agdecs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.agdec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.agdec h3{margin:4px 0 14px}
.agdec dl{margin:0;display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 12px;line-height:1.75}
.agdec dt{color:var(--brand);font-weight:var(--fw-strong)}
.agdec dd{margin:0}
.agdep th,.agdep td{text-align:center;padding-right:8px}
.agdep th:first-child,.agdep tbody th{text-align:left}
.agdep td{color:var(--brand)}
.agwb{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 36px #1f6f9c14}
.agbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding:12px 20px;background:var(--tint);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.agmode{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.agmode b{color:var(--ink)}
.agmode span{font-size:var(--fs-label);color:var(--warm-text)}
.agbarr{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.agver{font-size:var(--fs-label);color:var(--muted);font-variant-numeric:tabular-nums}
.agreset{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:var(--fs-label);color:var(--muted)}
.agwb .smallbtn.pri,#detail .smallbtn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.agwb .smallbtn:disabled{opacity:.45;cursor:not-allowed}

   0–1.2s，与小人的淡入、放大同时开始，全部部件共用同一条缓动曲线 cubic-bezier(.4,0,.2,1)：双臂从体侧抬起（主体停在平举，背后的姿态一路抬到 30°，边抬边分开、渐渐显出），
   双腿同时外摆，方框与圆同时从肚脐处展开——指尖碰到方框、落到圆上发生在同一刻；放射虚线、量角弧随圆，刻度、中线、
   脚下短排线随方框一起展开，比例标记开头就出现。剖面线与辅助线属于线稿，从第一帧就在。
   手臂垂下时在身体后面：两肩附近叠一份躯干（vfront）盖住袖口，抬到一半前后渐渐淡掉，袖口在最终位置显出来。
   上色（0.1–1.2s）：手稿的色块层由首屏背景色渐变到各部位的颜色（线稿阶段的背景色只为遮住人物身后的辅助线），
   阴影、腮红、嘴与眼镜同步出现；墨线层、纸面颗粒与墨迹位移一直都在，没有“先光滑、后换质感”的交接。
   转动与缩放由 heroIntro 按 .vfig 上的 vclock 动画时间逐帧写进 SVG 的 transform 属性，不用 CSS transform／opacity 动画：
   Chrome 会把做这类 CSS 动画的元素单独分层，分层时湍流滤镜的颗粒渲染得更糊，动画结束退回普通渲染会跳一下。
   颜色动画（fill、stroke、fill-opacity）不会触发分层。代价：动作期间每帧都要重算滤镜，WebKit 高分屏上帧率较低。 */
.vintro .vfig{animation:vclock 1.25s linear}
@keyframes vclock{from{--vclock:0}to{--vclock:1}}
.vintro .vchar.vfill :not(g),.vintro .vshadow,.vintro .vface .vblush{animation:vtint 1.1s cubic-bezier(.4,0,.2,1) .1s backwards}
.vintro .vface .vmouth{animation:vcolor 1.1s cubic-bezier(.4,0,.2,1) .1s backwards}
/* 背后的姿态起点与主体重合，两条线叠在一起会显粗：随着分开渐渐显出 */
.vintro .vchar.vfill .vghost :not(g){animation:vtint 1.1s cubic-bezier(.4,0,.2,1) .1s backwards,vghostin .5s cubic-bezier(.4,0,.2,1) .05s backwards}
.vintro .vchar.vink .vghost :not(g){animation:vghostin .5s cubic-bezier(.4,0,.2,1) .05s backwards}
.vintro .vface .vglass{animation:vline 1.1s cubic-bezier(.4,0,.2,1) .1s backwards}
.vintro .vface .veye ellipse{animation:veye 1.1s cubic-bezier(.4,0,.2,1) .1s backwards}
.vintro .vprop{animation:vpropin .4s ease-out backwards}
@keyframes vcolor{from{fill:var(--herobg);stroke:#3e6580}}
/* 只动填充：阴影、腮红与色块层本来没有描边，不能带上 stroke 的起点 */
@keyframes vtint{from{fill:var(--herobg)}}
@keyframes vline{from{stroke:#3e6580}}
@keyframes veye{from{fill:#3e6580}}
@keyframes vghostin{from{fill-opacity:0;stroke-opacity:0}}
@keyframes vpropin{from{stroke-opacity:0}}
@media(prefers-reduced-motion:reduce){.vintro .vchar *,.vintro .vface *,.vintro .vprop,.vintro .vshadow{animation:none}}
main.ppage,main.spage{animation:fadein .4s var(--ease) both}
/* 迭代 063：板块进场不再跟随滚动（原来用 animation-timeline:view()，要滑到才显示），改为换页后按文档顺序自动依次淡入上升，
   不用滚动、自己播完；第 10 个以后同时开始，整页约 1.3 秒内全部显示。由 autoIn() 加上 .ain 与序号 --k。 */
.ain{animation:rise .55s var(--ease) backwards;animation-delay:calc(120ms + var(--k,0) * 60ms)}
@media(prefers-reduced-motion:reduce){.ain{animation:none}}
@media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr);padding:22px 0 18px;gap:12px}.vit{max-width:360px;margin-top:0}}
@media(max-width:760px){.wrap{padding:0 20px}.cvsec{grid-template-columns:minmax(0,1fr)}.socials a{width:40px;height:40px}.cvmain>.cvtag{display:inline-block;margin-left:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ---------- 迭代 020 ----------
   导航栏淡蓝；主页的经历区也铺淡蓝底，每段经历一个白色椭圆框，框与框之间留出间距；
   全站的交互按钮统一成椭圆形（胶囊形）；首屏上下放宽，方向作品的图缩小。 */
:root{--navbg:#e3eef6;--cvbg:#eaf2f8;--pill:999px}
.nav{background:var(--navbg);box-shadow:0 0 0 100vmax var(--navbg);clip-path:inset(0 -100vmax)}
.langswitch{border-color:#cfe0ea}
/* 经历区 */
.cv{background:var(--cvbg);box-shadow:0 0 0 100vmax var(--cvbg);clip-path:inset(0 -100vmax);padding:26px 0 46px}
.cvsec,.cvsec:first-child{border-top:0;padding:18px 0}
.cvsec>h2{padding-top:12px}
.cvlist{display:grid;gap:14px}
.cvrow,.cvrow.lg{position:relative;background:#fff;border-radius:30px;padding:15px 28px;box-shadow:0 1px 2px #1f6f9c0f,0 6px 18px #1f6f9c0d;transition:box-shadow .35s var(--ease),transform .35s var(--ease)}
.cvrow:hover{box-shadow:0 2px 4px #1f6f9c12,0 12px 28px #1f6f9c1c;transform:translateY(-1px)}
.cvrow.lg{padding-left:80px}
.cvlogo,.cvrow.lg:first-child .cvlogo{left:28px;top:16px}
.cvhead,.cvrow:first-child .cvhead{padding:0}

summary.cvhead:after{padding:1px 12px;border:1px solid var(--line);border-radius:var(--pill);font-size:var(--fs-meta);line-height:2;color:var(--brand-strong);transition:background .25s,color .25s,border-color .25s}
summary.cvhead:hover:after{background:var(--brand);border-color:var(--brand);color:#fff}
/* 没有详情的行，右侧留出同样宽的空位，日期和其他行对齐 */
div.cvhead:after{content:"详情 +";grid-column:3;grid-row:1;visibility:hidden;padding:1px 12px;border:1px solid transparent;font-size:var(--fs-meta);line-height:2;white-space:nowrap}
:lang(en) div.cvhead:after{content:"Details +"}
main:has(>.cv:last-child)+.footer{border-top:0}
.cvrow>.cvrefs{margin:10px 0 0;padding-left:0}
.cvrefs a,.pp-links a{border:0;background:var(--tint);border-radius:var(--pill);padding:3px 13px;margin:0 8px 6px 0;transition:background .25s,color .25s}
.cvrefs a:hover,.pp-links a:hover{background:var(--brand);color:#fff}
/* 其他按钮统一为椭圆 */
.dirclose{border:1px solid var(--line);border-radius:var(--pill);padding:3px 13px;background:#fff;transition:background .25s,color .25s,border-color .25s}
.dirclose:hover{background:var(--brand);border-color:var(--brand);color:#fff}
.pp-back{border:1px solid var(--line);border-radius:var(--pill);padding:3px 14px;background:#fff;transition:background .25s,color .25s,border-color .25s}
.pp-back:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.jump button,.filter,.seg button,.pp-toc button,.smallbtn,.cta,.vlabel{border-radius:var(--pill)}

/* 首屏放宽 */

@media(max-width:760px){.cvrow,.cvrow.lg{border-radius:24px;padding:14px 18px}.cvrow.lg{padding-left:62px}.cvlogo,.cvrow.lg:first-child .cvlogo{left:18px;top:16px}.cvsec>h2{padding-top:0}.dirrow .project{flex-basis:200px}}

/* ---------- 迭代 021 ----------
   三层底色：顶部导航白色，首屏淡蓝，经历区更淡的蓝。
   经历框改为磨砂玻璃（参考苹果的半透明材质）：半透明白底 + 背景模糊 + 细白描边 + 内侧高光，圆角调小。
   玻璃要有东西可以“透”，所以经历区的底色里铺了几团很淡的蓝色光晕。 */
:root{--herobg:#e6f0f7;--cvbg:#f3f8fc;--glass:rgba(255,255,255,.56);--glass-line:rgba(255,255,255,.85)}
.nav{background:#fff;box-shadow:0 0 0 100vmax #fff}
.hero.band{background:var(--herobg);box-shadow:0 0 0 100vmax var(--herobg)}
.cv{position:relative;isolation:isolate;background:none;box-shadow:none;clip-path:none}
.cv:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);z-index:-1;
  background:radial-gradient(42% 46% at 12% 22%,#d4e6f3 0,rgba(212,230,243,0) 100%),radial-gradient(36% 40% at 88% 48%,#d9eaf5 0,rgba(217,234,245,0) 100%),radial-gradient(40% 34% at 40% 92%,#dcecf7 0,rgba(220,236,247,0) 100%),var(--cvbg)}
.cvrow,.cvrow.lg{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--glass-line);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(31,80,120,.05),0 10px 30px rgba(31,80,120,.07)}
.cvrow:hover{background:rgba(255,255,255,.72);box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(31,80,120,.06),0 16px 36px rgba(31,80,120,.11)}
/* 首屏上的方向标签和联系图标也用同一种玻璃 */
.vlabel,.socials a,.cta.ghost{background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border-color:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(31,80,120,.06),0 4px 14px rgba(31,80,120,.06)}
summary.cvhead:after{background:rgba(255,255,255,.5);border-color:rgba(31,111,156,.18)}
@media(max-width:760px){.cvrow,.cvrow.lg{border-radius:14px}}

/* ---------- 迭代 022 ----------
   蓝色降饱和：首屏是偏灰的淡蓝，经历区接近白色、只带一点点蓝，两层明显区分。
   导航栏固定在顶部（滚动时不动），半透明白色磨砂，下面的内容滚过时隐约可见。 */
:root{--herobg:#e7edf1;--cvbg:#f8fafb}
.cv:before{background:radial-gradient(42% 46% at 12% 22%,#edf2f5 0,rgba(237,242,245,0) 100%),radial-gradient(36% 40% at 88% 48%,#eef3f6 0,rgba(238,243,246,0) 100%),var(--cvbg)}
.cvrow,.cvrow.lg{background:rgba(255,255,255,.62);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(40,60,80,.04),0 8px 26px rgba(40,60,80,.06)}
.cvrow:hover{box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(40,60,80,.05),0 14px 32px rgba(40,60,80,.09)}
html{scroll-padding-top:84px}
.nav{position:sticky;top:0;z-index:30;background:none;box-shadow:none;clip-path:none;isolation:isolate}
.nav:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);z-index:-1;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid rgba(40,60,80,0);transition:border-color .3s,background .3s}
.nav.scrolled:before{background:rgba(255,255,255,.66);border-bottom-color:rgba(40,60,80,.08)}
@media(max-width:760px){.nav{padding:8px 0 4px;gap:2px 12px;min-height:0}.navlinks{gap:2px 22px}.navlinks a,.navlinks .navlabel{padding:7px 0}.langswitch button{min-height:34px;min-width:36px;padding:4px 8px}html{scroll-padding-top:100px}}

/* ---------- 迭代 023 ----------
   参考 caozhijun.top：顶部导航铺满整个窗口、固定在顶上（与迭代 022 相同）；下面是一张居中的“信纸”，紧贴导航开始，
   没有圆角、没有投影，两侧只有一根极淡的细线，信纸外是纯白的宽留边。首屏和经历区的色块只铺到信纸的宽度。手机上不变。 */
@media(min-width:1000px){
  /* 两侧留白：非常淡的蓝 #F8FAFB（所有页面统一）；中间的信纸主体是白色 */
  html,body{background:#f8fafb}
  .wrap{--pad:64px;max-width:min(1080px,calc(100% - 160px));padding:0 var(--pad);background:#fff;box-shadow:-1px 0 0 rgba(40,60,80,.06),1px 0 0 rgba(40,60,80,.06)}
  .band,.hero.band{box-shadow:0 0 0 var(--pad) var(--herobg);clip-path:inset(0 calc(-1 * var(--pad)))}
  .pp-top.band,.pp-top{background:var(--herobg);box-shadow:0 0 0 var(--pad) var(--herobg)}
  .cv:before{left:calc(-1 * var(--pad));right:calc(-1 * var(--pad));width:auto;transform:none}
  .ppage>.cmod:nth-of-type(even){background:var(--herobg);box-shadow:0 0 0 var(--pad) var(--herobg);clip-path:inset(0 calc(-1 * var(--pad)))}
}
/* 经历区不铺蓝色，改回白色；首屏（以及项目页页头、案例页的交替色块）用 #F2F6F9，与两侧留白互换 */
:root{--herobg:#f2f6f9}
.cv:before{background:#fff}
/* 人体图不再做淡入和放大（滤镜较重，个别浏览器会停在透明状态） */

/* ---------- 迭代 024：研究方法文章页（#/a/…） ---------- */

/* ---------- 迭代 026：设计页的图统一排法；研究文章的上一篇/下一篇与设计页一致 ---------- */

.stripctl button:hover{background:var(--brand);border-color:var(--brand);color:#fff}

.strip:focus-visible{outline:2px solid var(--brand);outline-offset:4px}

.rcbrief{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:0 32px;padding:34px 0 10px}
