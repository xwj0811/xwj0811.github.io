  return `<div class="wrap">${navMarkup('')}<main id="main" class="spage missing">${art}<h1 class="pagetitle" id="pg-title" tabindex="-1">${B('这个项目已不在目录里','This project is no longer listed')}</h1><p class="ms-note">${B('它可能已被移除，或者链接地址有误。','It may have been removed, or the link may be mistyped.')}</p><p class="ms-links"><a class="cta" href="#/projects">${secName('projects')}${arw('r')}</a><a class="cta ghost" href="#/thinking">${secName('thinking')}${arw('r')}</a><a class="cta ghost" href="#">${B('主页','Home')}${arw('r')}</a></p></main>${footerMarkup()}</div>`}
/* 看大图：整图浏览时图片缩到窗口内；「查看细节」按实际大小显示，可以滚动或拖动；也可以在新窗口打开原图。左右键或按钮切换。 */
let shotState=null;
function showShot(k,focus){
  const {p,shots}=shotState,n=shots.length;k=(k+n)%n;shotState.k=k;shotState.zoom=false;const g=shots[k],cap=bi(g.cap);
  /* 迭代 059：标题后面的「3 / 13」做成小标签；图放在固定高度的浅色衬底上（翻页时对话框不再忽高忽低），左右两侧是圆形翻页按钮，下面一行左边图注、右边工具。 */
  $('#detail-title').innerHTML=`${esc(L(p,'title'))} <span class="shotcount">${k+1} / ${n}</span>`;
  $('#detail-body').innerHTML=`<div class="shotstage"><div class="shotbox"><img class="shotimg" src="${esc(g.src)}" alt="${esc(cap||L(p,'title')+' '+(k+1))}"></div>${n>1?`<button type="button" class="shotarrow prev" data-shotstep="-1" aria-label="${B('上一张','Previous')}">${arw('l',1)}</button><button type="button" class="shotarrow next" data-shotstep="1" aria-label="${B('下一张','Next')}">${arw('r',1)}</button>`:''}</div><div class="shotbar">${cap?`<p class="shotcap">${esc(cap)}</p>`:''}<div class="shotnav"><button type="button" class="smallbtn" data-shotzoom aria-pressed="false">${B('查看细节','Zoom in')}</button><a class="textlink" target="_blank" rel="noopener noreferrer" href="${esc(g.src)}">${B('查看原图','Open original')}${arw('ur')}</a></div></div>`;
  $$('[data-shotstep]').forEach(b=>b.onclick=()=>showShot(shotState.k+Number(b.dataset.shotstep),b.dataset.shotstep));
  const box=$('.shotbox'),zb=$('[data-shotzoom]');
  zb.onclick=()=>{const on=shotState.zoom=!shotState.zoom;box.classList.toggle('zoomed',on);zb.setAttribute('aria-pressed',String(on));zb.textContent=on?B('适应窗口','Fit to window'):B('查看细节','Zoom in');if(on){box.scrollLeft=(box.scrollWidth-box.clientWidth)/2;box.scrollTop=0}};
  /* 鼠标拖动平移；触摸屏用手指滚动，不拦截页面本身的缩放 */
  let drag=null;
  box.onpointerdown=e=>{if(!shotState.zoom||e.pointerType!=='mouse')return;drag={x:e.clientX,y:e.clientY,l:box.scrollLeft,t:box.scrollTop};box.setPointerCapture(e.pointerId);e.preventDefault()};
  box.onpointermove=e=>{if(!drag)return;box.scrollLeft=drag.l-(e.clientX-drag.x);box.scrollTop=drag.t-(e.clientY-drag.y)};
  box.onpointerup=box.onpointercancel=()=>{drag=null};
  if(focus)document.querySelector(`[data-shotstep="${focus}"]`)?.focus();
}
function openShot(i,k,opener){const p=data.projects[i];shotState={p,shots:picsOf(p),k,zoom:false,opener};const d=$('#detail');d.classList.add('wide');showShot(k);d.showModal()}

/* 地址：# 主页；#/design、#/research、#/other 三个栏目页；#/p/序号 项目页。 */
function route(){const h=location.hash;if(PUBLIC_HOME_ONLY&&/^#\/(projects|thinking|other|design|research|p|n|a)(\/|$)/.test(h)){history.replaceState(null,'',location.pathname+location.search);return{id:'home'}}let m=h.match(/^#\/p\/([^/?#]+)$/);if(m){let tok=m[1];try{tok=decodeURIComponent(tok)}catch{}const i=indexOfId(idOf(tok));return i>=0?{id:'p'+i,i}:{id:'missing'}}m=h.match(/^#\/n\/([A-Za-z0-9]+)$/);if(m)return FS&&FS.pages[m[1]]?{id:'n:'+m[1],tok:m[1]}:{id:'missing'};m=h.match(/^#\/a\/([\w-]+)$/);if(m)return AR[m[1]]?{id:'a:'+m[1],art:m[1]}:{id:'missing'};m=h.match(/^#\/(projects|thinking|other|design|research)$/);if(m){const id=({design:'projects',research:'thinking'})[m[1]]||m[1];if(id!==m[1])history.replaceState(null,'','#/'+id);return{id}};return{id:'home',anchor:/^#[A-Za-z][\w-]*$/.test(h)?h:''}}
let shown=null;
/* 从栏目页点进项目再返回时，回到原来的位置和那张卡片 */
const scrollPos={};
const wideMq=matchMedia('(min-width:901px)');
/* 人体图在宽屏和窄屏下的画法不同（宽屏带引线），跨过断点时只重画这张图，页面其余部分（例如已展开的简历详情）保持原样。 */
/* 人体图不在屏幕内时暂停引线与标签的循环动画（漂浮、流光），省掉看不见的重绘（迭代 094） */
const vitIO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('vpause',!e.isIntersecting))):null;
const watchVit=()=>{if(!vitIO)return;vitIO.disconnect();const v=$('.vit');if(v)vitIO.observe(v)};
const bindDomains=()=>{$$('[data-domain]').forEach(b=>b.onclick=()=>updateDomain(Number(b.dataset.domain)));watchVit()};
wideMq.onchange=()=>{const v=$('.vit');if(shown==='home'&&v){v.outerHTML=heroArt();bindDomains()}};
function render(nav){
  CASES.portfolio?.unbind();
  const r=route(),prevId=shown||'',changed=r.id!==shown,who=lang==='en'?data.english:data.name;shown=r.id;
  document.documentElement.lang=lang==='en'?'en':'zh-CN';
  if(r.id==='home'){
    document.title=lang==='en'?`${data.english} · Human Factors & Experience Design`:data.name+' · 人因与体验设计';
    $('#site').innerHTML=homeMarkup();
    bindDomains();bindDirClose();heroIntro();cvReveal();
  }else if(r.id==='missing'){
    document.title=`${B('项目不在目录里','Project not listed')} · ${who}`;
    $('#site').innerHTML=missingMarkup();
  }else if(r.art){
    document.title=`${AR[r.art].title} · ${who}`;
    $('#site').innerHTML=articlePageMarkup(r.art);
  }else if(r.tok){
    document.title=`${FS.pages[r.tok].title} · ${who}`;
    $('#site').innerHTML=notePageMarkup(r.tok);
  }else if(SECTIONS.includes(r.id)){
    document.title=`${secName(r.id)} · ${who}`;
    $('#site').innerHTML=sectionMarkup(r.id);
    CASES.portfolio?.bind(r.id,prevId);
    $$('[data-galfilter]').forEach(b=>b.onclick=()=>filterGal(b.dataset.galfilter,b.dataset.cat));
    $$('[data-galopen]').forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.galopen.split('.');galDetail(k,Number(i))});
    $$('[data-gallery]').forEach(g=>filterGal(g.dataset.gallery,galFilter[g.dataset.gallery]));
    /* 竖幅的图完整显示，不裁切 */
    $$('.lifeimg img').forEach(im=>{const mark=()=>{if(im.naturalHeight>im.naturalWidth)im.parentElement.classList.add('tall')};im.complete?mark():im.addEventListener('load',mark)});
  }else{
    const p=data.projects[r.i];
    /* 旧的数字地址换成带编号的地址 */
    if(location.hash!==href(r.i))try{history.replaceState(null,'',href(r.i))}catch{}
    document.title=`${L(p,'title')} · ${who}`;
    $('#site').innerHTML=projectMarkup(r.i);
    caseOf(p)?.bind();
    $$('[data-shot]').forEach(b=>b.onclick=()=>openShot(r.i,Number(b.dataset.shot),b));
    /* 迭代 059：读出主图和并排过程图的宽高比（--ar）与原始宽度（--nw），交给样式：主图的图版贴合图片本身、不放大；过程图 3 张以内并排铺满一行，按宽高比分配宽度 */
    $$('.pp-hero img,.strip.fit img').forEach(im=>{const mark=()=>{if(!im.naturalHeight)return;const f=im.closest('.shot');f.style.setProperty('--ar',(im.naturalWidth/im.naturalHeight).toFixed(4));f.style.setProperty('--nw',im.naturalWidth+'px')};im.complete?mark():im.addEventListener('load',mark)});
  }
  if(r.id!=='home')autoIn();
  noOrphansWatch();
  $$('[data-lang]').forEach(b=>b.onclick=()=>{if(b.dataset.lang!==lang)setLang(b.dataset.lang)});
  /* 跳转链接：每种页面都跳到正文，文字随语言变化 */
  const sk=$('.skip');sk.textContent=B('跳到正文','Skip to content');sk.onclick=e=>{e.preventDefault();const m=$('#main');m.tabIndex=-1;m.focus({preventScroll:true});m.scrollIntoView()};
  if(nav){
    const from=/^p\d+$/.test(prevId)?Number(prevId.slice(1)):-1,back=SECTIONS.includes(r.id)&&from>=0&&data.projects[from]&&(CASES.portfolio?.navFor(data.projects[from])||secOf(data.projects[from]))===r.id;
    if(/^[na]:/.test(prevId)&&r.id==='thinking'){window.scrollTo({top:scrollPos.thinking||0,behavior:'instant'});(document.querySelector(`.port-articles a[href="#/${prevId[0]}/${prevId.slice(2)}"]`)||document.querySelector(`a[href="#/${prevId[0]}/${prevId.slice(2)}"]`)||$('#pg-title')).focus({preventScroll:true})}
    else if(back){const target=document.querySelector(`#read-${data.projects[from].id} h2 a`)||document.querySelector(`.project[data-index="${from}"] h3 a`)||$('#pg-title');const archive=target.closest('details');if(archive)archive.open=true;window.scrollTo({top:scrollPos[r.id]||0,behavior:'instant'});target.focus({preventScroll:true})}
    else if(r.id!=='home'){window.scrollTo(0,0);(r.i===undefined?$('#pg-title'):$('#pp-title')).focus({preventScroll:true})}
    else if(r.anchor)document.querySelector(r.anchor)?.scrollIntoView();
    else if(changed)window.scrollTo(0,0);
  }
}
/* 主页内的锚点由浏览器自己滚动；只有换页时才重新渲染。 */
/* 固定导航：页面滚动后底部出现一条极淡的分隔线 */
const navShade=()=>{const n=document.querySelector('.nav');if(n)n.classList.toggle('scrolled',scrollY>4)};
addEventListener('scroll',navShade,{passive:true});
window.addEventListener('hashchange',()=>setTimeout(navShade,0));
window.addEventListener('hashchange',()=>{const r=route();if(r.id==='home'&&shown==='home')return;if(SECTIONS.includes(shown))scrollPos[shown]=scrollY;render(true)});

function galDetail(key,i){const x=data[key][i];$('#detail').classList.remove('wide');$('#detail-title').textContent=L(x,'title');$('#detail-body').innerHTML=`<div class="detailmeta">${esc(L(x,'category'))}</div><img class="full" src="${esc(x.image)}" alt="${esc(L(x,'title'))}"><p>${esc(L(x,'text'))}</p>${safeUrl(x.url)?`<a class="textlink" target="_blank" rel="noopener noreferrer" href="${esc(safeUrl(x.url))}">${B('查看更多','More')}${arw('ur')}</a>`:''}`;$('#detail').showModal()}

/* ---------- 编辑器（界面为中文；可切换编辑中文内容或英文内容） ---------- */
let editLang='zh';
const field=(label,path,val,multi=false,hint='')=>`<label class="field ${multi?'wide':''}">${label}${multi?`<textarea data-path="${path}" placeholder="${esc(hint)}">${esc(val)}</textarea>`:`<input data-path="${path}" value="${esc(val)}" placeholder="${esc(hint)}">`}</label>`;
const enOn=()=>editLang==='en';
const group=(legend,rows)=>`<fieldset class="editsection"><legend>${legend}</legend><div class="fields">${rows.map(([l,k,m])=>enOn()&&SCALAR_TR.includes(k)?field(l+'（英文）',k+'_en',draft[k+'_en'],m,draft[k]):field(l,k,draft[k],m)).join('')}</div></fieldset>`;
function listEditor(key){const cfg=LISTS[key];return `<fieldset class="editsection"><legend>${cfg.title}</legend>${draft[key].map((item,i)=>`<div class="edititem"><div class="itemhead"><span>${cfg.title} ${i+1}${enOn()?' · '+esc(item.title||''):''}</span>${cfg.fixed?'':`<button type="button" class="smallbtn remove" data-remove="${key}.${i}">移除</button>`}</div><div class="fields">${Object.entries(cfg.fields).filter(([k])=>!(HIDE[key]||[]).includes(k)).map(([k,l])=>enOn()&&!NOTR.has(k)?field(l+'（英文）',`${key}.${i}.${k}_en`,item[k+'_en'],cfg.multi.includes(k),item[k]):field(l,`${key}.${i}.${k}`,item[k],cfg.multi.includes(k))).join('')}</div>${cfg.image?`<div class="imgctl"><label>选择图片 <input type="file" accept="image/jpeg,image/png,image/webp" data-img="${key}.${i}"></label><button type="button" class="smallbtn" data-imgremove="${key}.${i}">移除图片</button><span class="photo-status" data-imgstatus="${key}.${i}">${item.image?'已添加图片':'尚未添加图片'}</span></div>`:''}</div>`).join('')}${cfg.fixed?'':`<button type="button" class="smallbtn" data-add="${key}">＋ 添加${cfg.title}</button>`}</fieldset>`}
function sync(){for(const el of $$('[data-path]')){const parts=el.dataset.path.split('.');let obj=draft;for(const p of parts.slice(0,-1))obj=obj[p];obj[parts.at(-1)]=el.value}}

async function readImage(f,max,quality){
  if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>20*1024*1024)throw Error('请选择 20MB 以内的 JPG、PNG 或 WebP 图片');
  const u=URL.createObjectURL(f);
  try{const im=new Image();im.src=u;await im.decode();const c=document.createElement('canvas');const scale=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',quality)}
  finally{URL.revokeObjectURL(u)}
}
async function uploadPhoto(e){const f=e.target.files[0];if(!f)return;try{draft.photo=await readImage(f,500,.88);$('#photo-status').textContent='照片已准备好，点击保存并预览'}catch(err){notify(err.message||'照片无法读取，请换一张图片')}e.target.value=''}
async function uploadItemImage(e){const f=e.target.files[0];if(!f)return;const[k,i]=e.target.dataset.img.split('.');try{draft[k][+i].image=await readImage(f,1400,.84);document.querySelector(`[data-imgstatus="${k}.${i}"]`).textContent='图片已准备好，点击保存并预览'}catch(err){notify(err.message||'图片无法读取，请换一张图片')}e.target.value=''}

function editorRender(){
  $('#edit-form').innerHTML=`<div class="editlang" role="group" aria-label="编辑内容语言"><span>正在编辑：</span><button type="button" class="smallbtn" data-editlang="zh" aria-pressed="${!enOn()}">中文内容</button><button type="button" class="smallbtn" data-editlang="en" aria-pressed="${enOn()}">英文内容</button><small>${enOn()?'英文留空的地方，英文页面会显示中文原文（输入框里的灰字）。链接、图片等不分语言。':'切换到「英文内容」可以填写或修改对应的英文。'}</small></div><p class="editnote">「导出网页」只保存页面这一个文件；作品图片在主页文件夹的 images 里，移动或分享时要一起带上，导出的文件也要放回主页文件夹。「导出内容备份」只包含文字和内嵌在页面里的图片，不包含 images 里的文件。</p>`
    +`<div class="photo-controls"><label>选择个人照片 <input id="photo-upload" type="file" accept="image/jpeg,image/png,image/webp"></label><button type="button" class="smallbtn" id="photo-remove">移除照片</button><small>照片只在本机处理，导出网页时会一起保存。</small><span class="photo-status" id="photo-status">${draft.photo?'已添加个人照片':'尚未添加照片'}</span></div>`
    +group('自我陈述（首屏）',[['姓名','name'],['英文名','english'],['身份说明','roleLine'],['主标题第一行','headline'],['主标题第二行','accent'],['自我陈述','intro',true]])
    +group('联系方式与页脚',[['联系邮箱（可留空）','email'],['GitHub 主页（可留空）','githubUrl'],['领英主页（可留空）','linkedinUrl'],['Hugging Face 链接（可留空）','huggingFaceUrl'],['个人链接名称','socialLabel'],['个人链接 URL','socialUrl'],['简历链接 URL（可留空）','resumeUrl'],['页脚短句','footer']])
    +listEditor('education')+listEditor('work')+listEditor('intern')+listEditor('cvprojects')+listEditor('skills')
    +listEditor('domains')+listEditor('projects')
    +group('知识树（研究页）',[['根节点','treeRoot'],['根节点说明','treeRootNote']])
    +listEditor('tree')+listEditor('notes')+listEditor('life');
  $$('[data-editlang]').forEach(b=>b.onclick=()=>{if(b.dataset.editlang===editLang)return;sync();editLang=b.dataset.editlang;editorRender()});
  $('#photo-upload').onchange=uploadPhoto;
  $('#photo-remove').onclick=()=>{draft.photo='';$('#photo-status').textContent='照片已移除，保存后生效'};
  $$('[data-img]').forEach(el=>el.onchange=uploadItemImage);
  $$('[data-imgremove]').forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.imgremove.split('.');draft[k][+i].image='';document.querySelector(`[data-imgstatus="${k}.${i}"]`).textContent='图片已移除，保存后生效'});
  $$('[data-remove]').forEach(b=>b.onclick=()=>{sync();const[k,i]=b.dataset.remove.split('.');draft[k].splice(+i,1);editorRender()});
  $$('[data-add]').forEach(b=>b.onclick=()=>{sync();const k=b.dataset.add;if(draft[k].length>=50)return notify('每组最多 50 项');draft[k].push(Object.fromEntries(itemFields(k).map(f=>[f,f==='title'?'新的内容':''])));if(k==='projects')draft[k].at(-1).id='p'+Date.now().toString(36);editorRender()});
}

function save(){sync();data=validate(draft);let persisted=true;try{localStorage.setItem(key,JSON.stringify(pack(data)))}catch{persisted=false}render();return persisted}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}

$('#edit-open').onclick=()=>{draft=structuredClone(data);editLang=lang;editorRender();$('#editor').showModal()};
$('#edit-form').onsubmit=e=>e.preventDefault();
$('#detail').addEventListener('close',()=>{const o=shotState&&shotState.opener;if(o&&o.isConnected)o.focus({preventScroll:true});if(shotState)shotState.opener=null});
$('#detail').addEventListener('keydown',e=>{if(!shotState||!$('#detail').classList.contains('wide'))return;if(e.key==='ArrowRight'){e.preventDefault();showShot(shotState.k+1,'1')}else if(e.key==='ArrowLeft'){e.preventDefault();showShot(shotState.k-1,'-1')}});
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
$('#save').onclick=()=>{try{const ok=save();$('#editor').close();notify(ok?'已保存到当前浏览器。请导出网页保留为文件。':'已更新预览；内容较大，浏览器无法保存草稿，请导出网页保留。')}catch(err){notify(err.message||'内容无法保存，请检查填写的内容。')}};
$('#export').onclick=()=>{try{save()}catch(err){return notify(err.message||'内容无法保存，请检查填写的内容。')}const copy=document.documentElement.cloneNode(true);/* 导出的文件写入全部内容和内嵌的照片。images/ 里的作品图片仍是外部文件，要和导出的文件放在同一个文件夹里。 */copy.querySelector('#site-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');copy.querySelector('#site').innerHTML='';copy.querySelector('#edit-form').innerHTML='';copy.querySelector('#detail-body').innerHTML='';copy.querySelector('#detail-title').textContent='';copy.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));copy.querySelector('#notice').hidden=true;copy.querySelector('#notice').textContent='';copy.setAttribute('lang','zh-CN');download('<!doctype html>\n'+copy.outerHTML,'个人主页.html','text/html;charset=utf-8');notify('已导出网页文件，包含本次修改和编辑功能。作品图片不在这个文件里：请把它放回主页文件夹，和 images 文件夹放在一起。')};
$('#backup').onclick=()=>{try{save()}catch(err){return notify(err.message||'内容无法保存，请检查填写的内容。')}download(JSON.stringify(data,null,2),'主页内容备份.json','application/json');notify('已导出内容备份：文字和内嵌在页面里的图片。images 文件夹里的作品图片不在备份里。')};
$('#import').onclick=()=>$('#import-file').click();
$('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>80000000)throw Error();draft=validate(JSON.parse(await file.text()));editorRender();notify('已导入编辑区，点击保存或导出网页。')}catch{notify('无法导入，请选择从本主页导出的内容备份。')}e.target.value=''};
$('#reset').onclick=()=>{if(confirm('恢复此 HTML 文件中的原始内容？当前浏览器草稿将被清除。')){try{localStorage.removeItem(key)}catch{}data=structuredClone(original);draft=structuredClone(original);editorRender();render();notify('已恢复文件原稿。')}};
render(true);
})();
</script>
