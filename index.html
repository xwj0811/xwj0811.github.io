.cvperiod .cvtag{margin:0 10px 0 0}
.cvrole{display:inline-block;padding:0 8px;border-radius:4px;background:#eef3f6;color:var(--ink);line-height:1.8}
/* 迭代 072：设计、研究页的卡片一行三张（原来四张）。字号大一档后四列卡片只有 223px，标题和简介频繁折行；三列 304px，标题都能一行放下 */
.projectgrid.compact{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 16px}
.projectgrid.compact .projectvisual{height:96px}
.projectgrid.compact .projectmeta{margin-top:6px}
.projectgrid.compact h3{font-size:var(--fs-text);margin:2px 0 0}
.projectgrid.compact .project p{font-size:var(--fs-meta);line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:760px){.cvmain>.cvrole{display:table;margin-left:0}.projectgrid.compact{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---- 迭代 055：栏目页所有项目分组都用 compact（一行四个、760px 以内一行两个，原来只有建筑设计这样），
   项目卡片的图统一为横版 3:2（宽:高）。原来各处写死高度（230、200、170、164、130、118、96px），比例随列宽变，
   建筑设计一行四个时压成约 2.4:1 的扁条。这里覆盖上面所有写死高度的选择器，放在最后 ---- */
.projectvisual,.pgroup2 .projectvisual,#featured .projectvisual,.dirrow .projectvisual,.projectgrid.compact .projectvisual{height:auto;aspect-ratio:3/2}
/* 首屏简介下只保留联系方式图标；760px 以内保持 40px 便于点按。 */
.heroline{display:flex;flex-wrap:wrap;align-items:center;gap:20px 16px;margin-top:22px}
.heroline>.socials{margin-top:0}
.heroline .socials a{width:28px;height:28px}
@media(max-width:760px){.heroline>.socials{flex-basis:100%}.heroline .socials a{width:40px;height:40px}}
/* ---- 迭代 057：经历逐条进场。标题与每条经历进入视口时淡入上升，同一批依次错开 70ms（见 cvReveal）；
   只在动画期间生效（backwards），结束后不留样式，悬停上浮照常。原来整块区块随滚动升起的效果去掉，避免动两次 ---- */
.cvin{animation:rise .6s var(--ease) backwards;animation-delay:calc(var(--d0,0ms) + var(--k,0) * 70ms)}
@media(prefers-reduced-motion:reduce){.cvin{animation:none}}
@media print{.cvin,.ain{animation:none}}
/* ---- 迭代 059 · 栏目页：页头做成纸面蓝灰色带（与项目页页头同一种底色）＋小字眉题＋带数量的锚点条；分组标题带引线与数量、组间留白加大；
   卡片信息重新分层并逐行对齐（分类／标题／简介／性质与日期）；文章做成条目卡；页面撑满一屏。只作用于 main.secpage（三个栏目页），
   文章页（.fspage）、“项目不在目录里”页（.missing）和主页的方向作品行（.dirrow）不受影响 ---- */
/* 页面至少一屏高，页脚贴底：“其他”页内容少，原来白色纸面只到半屏 */
.wrap:has(>.secpage){display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
.secpage{flex:1 0 auto}
/* 页头色带 */
.sechead{padding:40px 0 0;background:var(--herobg);box-shadow:0 0 0 100vmax var(--herobg);clip-path:inset(0 -100vmax)}
@media(min-width:1000px){.sechead{box-shadow:0 0 0 var(--pad) var(--herobg);clip-path:inset(0 calc(-1 * var(--pad)))}}
.seckick{font-size:var(--fs-text);line-height:1.6;letter-spacing:.2em;text-transform:uppercase;color:var(--brand)}
.sectitle{display:flex;flex-wrap:wrap;align-items:center;gap:4px 20px;margin-top:4px;padding-bottom:34px}
/* 标题与数量之间是一段刻度尺（呼应首页人体图上的刻度）：每 8px 一条短刻度，每 40px 一条长刻度 */
.sectitle:before{content:"";order:1;flex:1 1 40px;height:7px;background:linear-gradient(#1b3a5430,#1b3a5430) left bottom/100% 1px no-repeat,repeating-linear-gradient(90deg,#1b3a5438 0 1px,transparent 1px 40px) left bottom/100% 7px no-repeat,repeating-linear-gradient(90deg,#1b3a5430 0 1px,transparent 1px 8px) left bottom/100% 4px no-repeat}
.secpage .pagetitle{padding:0}
.sectally{order:2;display:flex;white-space:nowrap;font-size:var(--fs-text);color:var(--muted);font-variant-numeric:tabular-nums}
.sectally span+span:before{content:"";display:inline-block;width:1px;height:.9em;margin:0 12px;background:#1b3a5433;vertical-align:-.08em}
/* 锚点条：一排等宽的格子（格数由模板写在 --n 里，760px 以内改为两列），每格上方一条细线；悬停或聚焦时细线变成品牌蓝、箭头下移。
   底部留 8px：色带用 clip-path 裁边，不留的话最下一排按钮的键盘焦点框会被裁掉 */
.secpage .jump{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:0 20px;margin:0;padding-bottom:8px}
.secpage .jump button{position:relative;display:flex;align-items:center;gap:7px;min-height:50px;padding:1px 2px 0;border:0;border-top:1px solid #1b3a5429;border-radius:0;background:none;color:var(--ink);font-family:var(--sub);font-size:var(--fs-sub);line-height:1.3;text-align:left;transition:color .25s var(--ease)}
.secpage .jump button:before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.secpage .jump button:hover{border-color:#1b3a5429;color:var(--brand-strong)}
.secpage .jump button:hover:before,.secpage .jump button:focus-visible:before{transform:scaleX(1)}
.secpage .jump button .jl{min-width:0;margin:0;font-size:var(--fs-sub);color:inherit;overflow-wrap:anywhere}
/* 数量写在组名的行内，紧跟最后一个字（中间是不换行空格）：英文组名折成两行时数量仍贴着文字，不会被甩到格子右侧 */
.secpage .jump button .jn{position:relative;top:-.45em;margin:0 0 0 3px;font-family:var(--font);font-size:var(--fs-text);line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.secpage .jump button .arw{margin-left:auto;color:var(--muted);transition:transform .3s var(--ease),color .25s var(--ease)}
.secpage .jump button:hover .arw,.secpage .jump button:focus-visible .arw{transform:translateY(3px);color:var(--brand)}
/* 英文组名较长：一行放不下时按宽度自动折成 3 或 4 列（每格至少 170px），组名保持一行，不挤成两行 */
@media(min-width:761px){:lang(en) .secpage .jump{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
/* 分组标题：名称 — 引线 — 数量；组与组之间的留白明显大于组内。scroll-margin 补回原来 26px 上内边距留出的净空：从锚点条跳过来时标题不贴在固定导航下沿 */
.secpage .subhead{display:flex;align-items:center;gap:18px;margin:84px 0 28px;padding:0;border:0;scroll-margin-top:26px}
.secpage .subhead:after{content:"";order:1;flex:1 1 24px;height:1px;background:var(--line)}
.secpage .subcount{order:2;font-family:var(--font);font-weight:400;font-size:var(--fs-text);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.secpage .sechead+.subhead{margin-top:52px}
/* 没有小类名的项目直接接在页头或文章列表后面时，同样留出一段间距（否则卡片会贴着上一块） */
.secpage .sechead+.projectgrid,.secpage .notelist+.projectgrid{margin-top:52px}
/* 卡片（迭代 074）：标题（最多三行，中文不会超过两行）、简介（最多三行）、底部一行左为“领域 · 性质”右为日期；同一排卡片的每一行都对齐（subgrid）。
   不支持 subgrid 的浏览器按先后顺序排列：标题、简介、底行 */
.secpage{--cardgap:44px}
.secpage .projectgrid.compact{gap:0 20px;margin-bottom:calc(-1 * var(--cardgap))}
.secpage .project{position:relative;padding-bottom:var(--cardgap)}
.secpage .projectmeta{display:contents}
.secpage .projectmeta .when{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 10px;margin-top:2px;font-size:var(--fs-text);line-height:1.7}
.secpage .projectmeta .date{margin-left:auto;font-size:var(--fs-text);color:var(--muted)}
.secpage .projectgrid.compact h3{margin:14px 0 0;font-size:var(--fs-sub);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.secpage .projectgrid.compact .project p.brief{margin-top:5px;font-size:var(--fs-text);line-height:1.65;color:var(--muted);-webkit-line-clamp:3}
@supports (grid-template-rows:subgrid){
  .secpage .projectgrid.compact>.project{display:grid;grid-template-rows:subgrid;grid-row:span 4;row-gap:0}
  .secpage .projectgrid.compact>.project[hidden]{display:none}
  .secpage .project>.projectvisual{grid-row:1}
  .secpage .projectgrid.compact h3{grid-row:2}
  .secpage .projectgrid.compact .project p.brief{grid-row:3}
  .secpage .projectmeta .when{grid-row:4;margin-top:11px;padding-top:7px;border-top:1px solid var(--line)}
}
/* 整张卡片可点：标题链接铺满卡片；键盘聚焦时焦点框画在整张卡片外沿（标题截断用了 overflow，框画在文字上会被裁掉） */
.secpage .project h3 a{transition:color .25s var(--ease)}
.secpage .project h3 a:after{content:"";position:absolute;inset:0 0 calc(var(--cardgap) - 8px);z-index:1;border-radius:20px 20px 4px 4px}
.secpage .project:hover h3 a{color:var(--brand)}
.secpage .project h3 a:focus-visible{outline:none}
.secpage .project h3 a:focus-visible:after{outline:3px solid var(--brand);outline-offset:5px}
/* 文章条目卡：与主页经历框同一种白卡片（圆角、极淡投影，悬停略微抬起），左侧序号，右侧标签与圆形箭头，整行可点 */
.secpage .notelist{grid-template-columns:minmax(0,1fr);gap:10px}
.secpage .subhead+.notelist{margin-bottom:0}
.secpage .notelist li{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) auto 30px;align-items:center;gap:0 16px;padding:15px 20px 15px 24px;border:1px solid #d8e3ea99;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(40,60,80,.04),0 8px 26px rgba(40,60,80,.06);transition:box-shadow .35s var(--ease),transform .35s var(--ease),border-color .35s var(--ease)}
.secpage .notelist li:hover{transform:translateY(-1px);border-color:#c5d8e4;box-shadow:0 2px 4px rgba(40,60,80,.05),0 14px 32px rgba(40,60,80,.09)}
.secpage .notelist .num{align-self:start;line-height:1.5;padding-top:.5em}
.secpage .notelist a{color:var(--ink);line-height:1.5;transition:color .25s var(--ease)}
.secpage .notelist a:after{content:"";position:absolute;inset:0;z-index:1;border-radius:16px}
.secpage .notelist li:hover a{color:var(--brand)}
.secpage .notelist a:focus-visible{outline:none}
.secpage .notelist a:focus-visible:after{outline:3px solid var(--brand);outline-offset:3px}
.secpage .notelist p{margin-top:2px;font-size:var(--fs-text);line-height:1.7;color:var(--muted)}
.notetag{padding:0 10px;border-radius:var(--pill);background:var(--brand-soft);color:var(--brand-strong);font-size:var(--fs-meta);line-height:1.9;letter-spacing:.04em;white-space:nowrap}
.notego{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;color:var(--brand-strong);transition:background .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease),transform .3s var(--ease)}
.secpage .notelist li:hover .notego{background:var(--brand);border-color:var(--brand);color:#fff;transform:translateX(2px)}
/* 标签与箭头固定在第 3、4 列：某篇没有标签时，箭头仍在最右一列 */
.secpage .notelist .notetag{grid-column:3}
.secpage .notelist .notego{grid-column:4}
@media(max-width:760px){
  .sechead{padding-top:26px}
  .sectitle{padding-bottom:22px}
  .secpage .jump{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
  .secpage .jump button{min-height:46px}
  .secpage .subhead{gap:12px;margin:56px 0 20px}
  .secpage .sechead+.subhead,.secpage .sechead+.projectgrid,.secpage .notelist+.projectgrid{margin-top:36px}
  .secpage{--cardgap:32px}
  .secpage .projectgrid.compact{column-gap:14px}
  .secpage .projectgrid.compact h3{margin-top:11px}
  .secpage .notelist li{grid-template-columns:minmax(0,1fr) 30px;gap:8px 12px;padding:14px 16px 16px 18px}
  .secpage .notelist .num{display:none}
  .secpage .notelist .notetag{grid-area:1/1;justify-self:start}
  .secpage .notelist .notego{grid-area:1/2}
  .secpage .notelist .notemain{grid-area:2/1/3/3}
}
/* 减少动效：栏目页上所有悬停位移都关掉（含原有的卡片上浮与封面放大），只留颜色、细线与阴影的变化 */
@media(prefers-reduced-motion:reduce){.secpage .notelist li:hover,.secpage .notelist li:hover .notego,.secpage .jump button:hover .arw,.secpage .jump button:focus-visible .arw,.secpage .project:hover,.secpage .project:hover .projectvisual svg,.secpage .project:hover .projectvisual img.cover{transform:none}}
@media print{.sechead{box-shadow:none;clip-path:none}}
/* ---- 迭代 059 · 作品项目页：页头做成封面（眉题＋标题＋信息栏，主图压在色带下沿）；图库有节奏（过程图横条通到纸边、3 张以内并排铺满、完整图版放在浅色带上、图注带编号）；上一个/下一个做成两张导航卡；看大图换成浅色衬底＋两侧翻页。页头与导航卡是项目页、图示案例页、文章页共用的 ---- */
/* --gut：正文到“信纸”边的距离（与 .wrap 的左右内边距相同），色带、横条都靠它通到纸边 */
.ppage{--gut:64px;--hero-h:78vh;--pp-shadow:0 1px 2px rgba(27,58,84,.07),0 16px 40px rgba(27,58,84,.12)}

/* 1 页头：从上到下是眉题（短横线＋项目性质／文章标签）、标题、一句话、信息栏 */
.pp-top,.pp-top.band{padding:24px 0 46px}
.pp-head{padding-top:38px;max-width:none}
.pp-meta{gap:2px 0;font-size:var(--fs-text);line-height:1.6;letter-spacing:.12em;color:var(--brand-strong)}
.pp-meta:before{content:"";flex:none;width:24px;height:1px;margin-right:12px;background:var(--brand)}
.pp-meta span+span:before{content:"·";margin:0 .7em;color:var(--muted)}
.pp-meta .status{font-weight:400}
:lang(en) .pp-meta{letter-spacing:.06em}
.pp-head h1{margin:12px 0 0;max-width:820px;line-height:1.5;letter-spacing:.02em;text-wrap:balance}
.pp-head .pp-lead{margin-top:10px;max-width:700px;line-height:1.85;text-wrap:pretty}
/* 信息栏：一条细线，下面每项是一行小标签、一行内容；链接靠右 */
.pp-spec{display:flex;flex-wrap:wrap;gap:14px 52px;margin:30px 0 0;padding-top:16px;border-top:1px solid rgba(27,58,84,.14)}
.pp-spec>div{min-width:0}
.pp-spec dt{font-size:var(--fs-text);line-height:1.6;letter-spacing:.12em;color:var(--muted)}
:lang(en) .pp-spec dt{letter-spacing:.06em}
.pp-spec dd{margin:3px 0 0;font-family:var(--sub);font-size:var(--fs-sub);line-height:1.7;color:var(--ink)}
.pp-spec .sp-date dd{font-variant-numeric:tabular-nums}
.pp-spec .sp-work{flex:1 1 200px;max-width:600px}
.pp-spec .sp-links{margin-left:auto}
.pp-spec .pp-links{display:flex;flex-wrap:wrap;gap:6px 8px;margin:2px 0 0;font-family:var(--font);font-size:var(--fs-text)}
.pp-spec .pp-links a{margin:0;padding:3px 13px;border:1px solid var(--line);background:#fff;transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
.pp-spec .pp-links a:hover{background:var(--brand);border-color:var(--brand);color:#fff}

/* 2 主图：贴合图片本身的白色图版，上半截压在页头色带上（色带由 :before 接着往下铺一段），投影让它浮在纸面上。
   图版宽度 = 正文宽、“一屏高 × 宽高比”、图片原始宽度三者里最小的（--ar、--nw 由 render 在图片载入后写上；没写上时退回整行宽） */
.pp-hero{position:relative;padding:0}
.pp-hero:before{content:"";position:absolute;top:0;left:calc(-1 * var(--gut));right:calc(-1 * var(--gut));height:clamp(56px,10vw,124px);background:var(--herobg)}
.pp-hero .shot{position:relative}
.pp-hero .shot button{width:min(100%,calc(var(--ar,9) * var(--hero-h)),var(--nw,100%));max-width:100%;margin:0 auto;background:#fff;box-shadow:var(--pp-shadow)}
.pp-hero .shot img{width:100%;max-height:var(--hero-h);object-fit:contain}
/* 图片按钮：不描边，改用 1px 的淡投影勾边；悬停时浮起并在右下角出现“放大”圆标（触摸屏上主图和图版常显） */
.shot button{position:relative;border:0;border-radius:var(--r);box-shadow:0 0 0 1px rgba(27,58,84,.1);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.shot button:focus-visible{border-radius:var(--r)}
.shot button:after{content:"";position:absolute;right:12px;bottom:12px;width:30px;height:30px;border-radius:50%;background:linear-gradient(var(--brand-strong),var(--brand-strong)) center/11px 1.5px no-repeat,linear-gradient(var(--brand-strong),var(--brand-strong)) center/1.5px 11px no-repeat,rgba(255,255,255,.94);box-shadow:0 2px 10px rgba(27,58,84,.2);opacity:0;transform:translateY(4px);transition:opacity .25s var(--ease),transform .25s var(--ease);pointer-events:none}
.shot button:hover:after,.shot button:focus-visible:after{opacity:1;transform:none}
.strip .shot button:hover,.platesec .shot button:hover{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(27,58,84,.1),0 16px 34px rgba(27,58,84,.16)}
.pp-hero .shot button:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(27,58,84,.07),0 22px 50px rgba(27,58,84,.17)}
@media(hover:none){.pp-hero .shot button:after,.platesec .shot button:after{opacity:1;transform:none}}
/* 图注：编号用品牌蓝，文字靠左 */
.shot figcaption{display:flex;align-items:baseline;gap:10px;margin-top:10px;font-size:var(--fs-text);line-height:1.7;color:var(--muted);text-align:left}
.shotno{flex:none;letter-spacing:.08em;color:var(--brand);font-variant-numeric:tabular-nums}

/* 3 问题 / 设计决定 / 交付物：三栏带编号 */
.pp-facts{gap:0 40px;padding:54px 0 0;counter-reset:ppfact}
.pp-facts section{counter-increment:ppfact;padding-top:14px}
.pp-facts h2{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.pp-facts h2:before{content:counter(ppfact,decimal-leading-zero);font-family:var(--font);font-size:var(--fs-text);letter-spacing:.08em;color:var(--brand)}
.pp-facts p{line-height:1.9}

/* 4 小节标题：数量做成小圆标；不再用整条横线分隔，靠留白 */
.pp-subrow{align-items:center;margin-top:62px;padding-top:0;border-top:0}
.stripsec .pp-sub span,.platesec .pp-sub span{display:inline-block;margin-left:12px;padding:1px 9px;border-radius:var(--pill);background:var(--tint2);color:var(--brand-strong);line-height:1.6;vertical-align:.3em;font-variant-numeric:tabular-nums}
.stripsec{margin:0}
/* 过程图横条：左右通到纸边，第一张与正文左缘对齐；不显示滚动条（有左右按钮，也可以拖动、用方向键） */
.strip{gap:18px;margin:0 calc(-1 * var(--gut));padding:20px 0 22px var(--gut);scroll-padding-left:var(--gut);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip:after{content:"";flex:0 0 calc(var(--gut) - 18px)}
.strip:focus-visible{outline-offset:-2px;border-radius:0}
/* 3 张以内：不滑动，并排铺满一行。--ar 是图片宽高比（render 里读出来），宽度按它分配，所以各图一样高；太高时按高度封顶并居中 */
.strip.fit{overflow:visible;margin:0;padding:20px 0 0;justify-content:center;scroll-snap-type:none}
.strip.fit:after{content:none}
.strip.fit .shot{flex:var(--ar,1.4) 1 0px;width:auto;min-width:0;max-width:calc(var(--ar,1.4) * min(540px,66vh))}
.strip.fit[data-n="1"] .shot{max-width:calc(var(--ar,1.4) * min(680px,78vh))}
.strip.fit .shot button{width:100%}
.strip.fit .shot img{width:100%;height:auto;max-width:100%;aspect-ratio:var(--ar,1.4);object-fit:contain}

/* 5 完整图版：放在一条浅色带上（与页头、案例页的交替色带同一种底色），每张是一块白色图版 */
.platesec{margin-top:66px;padding:54px 0 62px;background:var(--herobg);box-shadow:0 0 0 var(--gut) var(--herobg);clip-path:inset(0 calc(-1 * var(--gut)))}
.platesec .pp-sub{margin:0;padding:0;border:0}
.platesec .shots.rows{columns:auto;padding:26px 0 0}
.platesec .shots.rows .shot{margin:0 0 40px}
.platesec .shots.rows .shot:last-child{margin-bottom:0}
.platesec .shot button{background:#fff;box-shadow:0 1px 2px rgba(27,58,84,.06),0 12px 32px rgba(27,58,84,.09)}
.platesec .shot figcaption{margin-top:12px;letter-spacing:.08em}

/* 6 上一个 / 下一个：两张导航卡，圆形箭头在外侧；悬停时卡片浮起、箭头变实并朝外挪一点 */
.pp-nav{gap:16px;margin-top:64px;padding-top:0;border-top:0}
.pp-nav a{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:96px;padding:20px 26px 20px 88px;border:1px solid var(--line);border-radius:var(--r);background:#fff;line-height:1.55;text-wrap:balance;transition:background .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease),transform .3s var(--ease)}
.pp-nav a:last-child{padding:20px 88px 20px 26px;text-align:right}
.pp-nav a:focus-visible{border-radius:var(--r)}
.pp-nav small{margin-bottom:3px;letter-spacing:.12em;color:var(--muted)}
:lang(en) .pp-nav small{letter-spacing:.06em}
.pp-nav small .arw{position:absolute;top:50%;left:26px;width:40px;height:40px;margin:-20px 0 0;padding:12px;border:1px solid var(--line);border-radius:50%;background:var(--tint);color:var(--brand-strong);transition:background .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease),transform .3s var(--ease)}
.pp-nav a:last-child small .arw{left:auto;right:26px}
.pp-nav a:hover{color:var(--ink);background:var(--tint);border-color:#bfd5e2;box-shadow:0 12px 30px rgba(31,80,120,.1);transform:translateY(-2px)}
.pp-nav a:hover small .arw{background:var(--brand);border-color:var(--brand);color:#fff;transform:translateX(-4px)}
.pp-nav a:last-child:hover small .arw{transform:translateX(4px)}
.pp-nav>span:empty{display:none}
.pp-nav>span:empty+a{grid-column:2}

/* 7 看大图 / 生活与创作的详情对话框 */
#detail{border:0;border-radius:20px;box-shadow:0 30px 90px rgba(13,36,56,.34)}
#detail::backdrop{background:rgba(18,42,62,.58);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#detail[open]{animation:ppdlg .28s var(--ease)}
@keyframes ppdlg{from{opacity:0;transform:translateY(10px) scale(.985)}}
#detail .dialoghead{padding:14px 18px 14px 26px}
#detail .dialoghead h2{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;min-width:0}
.shotcount{padding:1px 10px;border-radius:var(--pill);background:var(--tint2);font-family:var(--font);font-size:var(--fs-text);line-height:1.7;color:var(--brand-strong);font-variant-numeric:tabular-nums;white-space:nowrap}
#detail .close{flex:none;width:34px;height:34px;color:var(--brand-strong);background:#fff;transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
#detail .close:hover{background:var(--brand);border-color:var(--brand);color:#fff}
#detail .close:focus-visible{border-radius:50%}
/* 图放在固定高度的浅色衬底上：翻页时对话框大小不变，左右按钮不会跳 */
.shotstage{position:relative}
.shotstage .shotbox{height:min(70vh,calc(95vh - 196px));max-height:none;align-items:center;padding:22px 64px;border-radius:var(--r);background:var(--herobg)}
.shotstage .shotimg{max-height:100%;margin:auto;border-radius:6px;box-shadow:0 1px 2px rgba(27,58,84,.08),0 12px 34px rgba(27,58,84,.14)}
.shotstage .shotbox.zoomed{padding:0;border:0;border-radius:var(--r)}
.shotstage .shotbox.zoomed .shotimg{box-shadow:none}
.shotarrow{position:absolute;top:50%;display:grid;place-items:center;width:42px;height:42px;margin-top:-21px;padding:0;border:1px solid rgba(255,255,255,.9);border-radius:50%;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--brand-strong);box-shadow:0 2px 10px rgba(27,58,84,.14);transition:background .25s var(--ease),color .25s var(--ease),transform .25s var(--ease)}
.shotarrow.prev{left:12px}.shotarrow.next{right:12px}
.shotarrow:hover{background:var(--brand);color:#fff}
.shotarrow.prev:hover{transform:translateX(-2px)}.shotarrow.next:hover{transform:translateX(2px)}
.shotarrow:focus-visible{border-radius:50%}
.shotbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;margin-top:14px}
.shotbar .shotcap{flex:1 1 280px;margin:0;text-align:left;line-height:1.7}
.shotbar .shotnav{margin:0 0 0 auto;gap:8px}
.shotbar .smallbtn,.shotbar .textlink{padding:5px 14px;border:1px solid var(--line);border-radius:var(--pill);background:#fff;font-size:var(--fs-text);line-height:1.7;color:var(--brand-strong);transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
.shotbar .smallbtn:hover,.shotbar .textlink:hover,.shotbar .smallbtn[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.shotbar .smallbtn:focus-visible,.shotbar .textlink:focus-visible{border-radius:var(--pill)}
/* 生活与创作的详情（不是 wide）：图片在最上面、铺到对话框边 */
#detail:not(.wide) .detailbody{display:flex;flex-direction:column;align-items:flex-start;padding-top:0}
#detail:not(.wide) .detailbody img.full{order:-1;align-self:stretch;width:auto;margin:0 -26px 20px;border-radius:0;background:var(--herobg)}
#detail:not(.wide) .detailmeta{margin-bottom:8px;letter-spacing:.12em}
#detail:not(.wide) .detailbody p{line-height:1.9}
#detail:not(.wide) .detailbody .textlink{margin-top:14px}

/* 8 手机（760px 以内） */
@media(max-width:760px){
  .ppage{--gut:20px;--hero-h:64vh}
  .pp-top,.pp-top.band{padding:14px 0 30px}
  .pp-head{padding-top:22px}
  .pp-spec{gap:14px 32px;margin-top:22px;padding-top:14px}
  .pp-spec .sp-work,.pp-spec .sp-links{flex:1 1 100%;max-width:none;margin-left:0}
  .pp-hero .shot img{max-height:var(--hero-h)}
  .pp-facts{gap:20px 0;padding-top:36px}
  .pp-subrow{margin-top:44px}
  .strip{gap:12px;padding:16px 0 18px var(--gut)}
  .strip:after{flex-basis:calc(var(--gut) - 12px)}
  .strip.fit{flex-wrap:wrap;padding:16px 0 0}
  .strip.fit .shot{max-width:calc(var(--ar,1.4) * 64vh)}
  .strip.fit[data-n="3"] .shot{flex-basis:calc(var(--ar,1.4) * 130px)}
  .shot button:after{right:8px;bottom:8px;width:26px;height:26px}
  .platesec{margin-top:46px;padding:38px 0 42px}
  .platesec .shots.rows{padding-top:20px}
  .platesec .shots.rows .shot{margin-bottom:26px}
  .pp-nav{gap:10px;margin-top:44px}
  .pp-nav a{min-height:76px;padding:14px 16px 14px 68px}
  .pp-nav a:last-child{padding:14px 68px 14px 16px}
  .pp-nav small .arw{left:14px;width:38px;height:38px;margin-top:-19px;padding:11px}
  .pp-nav a:last-child small .arw{right:14px}
  .pp-nav>span:empty+a{grid-column:auto}
  #detail{border-radius:16px}
  #detail .dialoghead{padding:10px 12px 10px 18px}
  #detail .close{width:44px;height:44px}
  .shotstage,.shotbar{margin-left:-6px;margin-right:-6px}
  .shotstage{margin-top:-10px}
  .shotstage .shotbox{height:auto;min-height:38vh;max-height:60vh;padding:12px}
  .shotstage .shotimg{max-height:calc(60vh - 24px)}
  .shotstage .shotbox.zoomed{height:60vh}
  .shotstage .shotbox.zoomed .shotimg{max-height:none}
  .shotarrow{width:44px;height:44px;margin-top:-22px}
  .shotarrow.prev{left:6px}.shotarrow.next{right:6px}
  .shotbar .shotnav{margin-left:0}
  .shotbar .smallbtn,.shotbar .textlink{display:inline-flex;align-items:center;min-height:44px;padding:5px 16px}
  #detail:not(.wide) .detailbody img.full{margin:0 -18px 16px}
}
/* 减少动画：全站已关掉过渡，这里再去掉悬停时的位移 */
@media(prefers-reduced-motion:reduce){
  .strip .shot button:hover,.platesec .shot button:hover,.pp-hero .shot button:hover,.shot button:after,.pp-nav a:hover,.pp-nav a:hover small .arw,.pp-nav a:last-child:hover small .arw,.shotarrow.prev:hover,.shotarrow.next:hover{transform:none}
  #detail[open]{animation:none}
}
/* ---- 迭代 059 · 图示案例页：模块头（序号＋刻度线＋标题＋导语）、概述三卡（核心问题突出）、图版、卡片/列表/步骤/表格/提示块统一、模块留白与手机端 ---- */
/* 只覆盖外观，不改结构与文字。通用类名前面加 :where(.cmod)：只在案例模块里生效，优先级与原规则相同（靠后者胜），
   不会压过按钮的选中态等更具体的旧规则。圆角在案例模块里统一成 16px（变量继承，模块内所有卡片、图框一起变）；细线用同一种半透明墨色 */
.cmod,.rcbrief{--r:16px;--hair:rgba(40,60,80,.1);--rule:#b9cdd9}

/* 1 模块头：序号放大成标题字号的细体数字，后面一根细线，线的开头是一小段蓝色刻度尺（长短刻度相间，呼应“测量”）；
   标题另起一行，与正文左对齐；导语用小标题字号。序号列定宽 30px，刻度落在整像素上 */
.cmod{padding:72px 0 76px}
.cmod-head{grid-template-columns:30px minmax(0,1fr);gap:18px 8px;align-items:center;margin-bottom:30px}
.cmod-head .num{padding:0;font-size:var(--fs-title);line-height:1;letter-spacing:.06em;color:var(--brand)}
.cmod-head:after{content:"";grid-area:1/2;height:8px;background:repeating-linear-gradient(90deg,var(--brand) 0,var(--brand) 1px,rgba(31,111,156,0) 1px,rgba(31,111,156,0) 12px) 0 100%/37px 8px no-repeat,repeating-linear-gradient(90deg,var(--brand) 0,var(--brand) 1px,rgba(31,111,156,0) 1px,rgba(31,111,156,0) 6px) 0 100%/37px 4px no-repeat,linear-gradient(var(--line),var(--line)) 0 100%/100% 1px no-repeat}
.cmod-head>div{grid-column:1/-1;min-width:0}
.cmod-head h2{margin:0;letter-spacing:.01em}
.cmod-head p{margin-top:8px;max-width:760px;font-size:var(--fs-sub);line-height:1.75}
.cmod h3.sub{margin:44px 0 18px;display:flex;align-items:flex-start;gap:12px}
.cmod h3.sub:before{content:"";flex:0 0 14px;height:1px;margin-top:.7em;background:var(--brand)}
.cmod-foot{margin-top:22px}

/* 2 概述三栏改成三张信息卡：前两张浅底墨字；核心问题用墨色底白字（对比度与原来的墨字白底相同），角上三道同心细弧（呼应图示里的转动中心） */
.rcbrief{gap:16px;padding:36px 0 20px}
.rcbrief section{border-top:0;border-radius:var(--r);padding:22px 24px 24px;background:var(--herobg);color:var(--ink)}
.rcbrief h2{margin-bottom:10px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.rcbrief h2:after{content:"";flex:1;height:1px;background:rgba(40,60,80,.14)}
.rcbrief li::marker{color:var(--brand)}
.rcbrief section.rcq{background:radial-gradient(circle at 100% 100%,rgba(255,255,255,0) 43px,rgba(255,255,255,.2) 44px,rgba(255,255,255,.2) 45px,rgba(255,255,255,0) 46px,rgba(255,255,255,0) 83px,rgba(255,255,255,.14) 84px,rgba(255,255,255,.14) 85px,rgba(255,255,255,0) 86px,rgba(255,255,255,0) 123px,rgba(255,255,255,.09) 124px,rgba(255,255,255,.09) 125px,rgba(255,255,255,0) 126px) var(--ink);box-shadow:0 1px 2px rgba(27,58,84,.16),0 14px 32px rgba(27,58,84,.18)}
.rcq h2{color:#fff}
.rcq h2:after{background:rgba(255,255,255,.3)}
.rcq p{color:#fff;line-height:1.8}
.rcq li::marker{color:#fff}

/* 3 图版：白底、极淡的边和一层柔和投影；带图示的图框铺点阵“制图纸”（半透明色块组成的相关矩阵除外，点会透出来）；
   图注做成图版底部的白色注条，前面一小段蓝色刻度 */
:where(.cmod) .cgrid figure,:where(.cmod) .calc-out,:where(.cmod) .chartbox,:where(.cmod) .panel{--fp:22px;border-color:var(--hair);padding:var(--fp) var(--fp) 18px;box-shadow:0 1px 2px rgba(40,60,80,.04),0 10px 30px rgba(40,60,80,.06)}
:where(.cmod) .cgrid figure:has(>svg.cfig:not([style*="max-width"])){background:radial-gradient(circle,rgba(31,111,156,.16) 0,rgba(31,111,156,.16) .9px,rgba(31,111,156,0) 1.3px) 3px 3px/16px 16px #fff}
:where(.cmod) .cgrid figcaption{margin:16px calc(-1 * var(--fp)) -18px;padding:12px var(--fp) 16px;border-top:1px solid var(--hair);border-radius:0 0 calc(var(--r) - 1px) calc(var(--r) - 1px);background:#fff;line-height:1.75}
:where(.cmod) .cgrid figcaption:before{content:"";display:inline-block;width:14px;height:1px;margin-right:8px;vertical-align:middle;background:var(--brand)}
:where(.cmod) .figtag{padding:2px 12px;letter-spacing:.08em}
/* 相关矩阵的斜排列名原来被 svg 边界裁掉最后一个：这张图比图版窄，放开裁剪 */
:where(.cmod) .cgrid figure>svg.cfig[style*="max-width"]{overflow:visible}

/* 4 卡片一族：同一种边、同一种内距；卡片里的序号与模块序号同一种数字；数据条与流程条 */
:where(.cmod) .card,:where(.cmod) .rule div,:where(.cmod) .fwbox,:where(.cmod) .bcol,:where(.cmod) .stepcard,:where(.cmod) .flowrow>div,.rcretro,:where(.cmod) .sdtread div{border-color:var(--hair)}
:where(.cmod) .bcol{border-top-color:var(--ink)}
:where(.cmod) .card,:where(.cmod) .rule div{padding:24px 24px 26px}
:where(.cmod) .card .num,:where(.cmod) .num:has(+h3){display:block;margin-bottom:10px;font-size:var(--fs-sub);line-height:1;letter-spacing:.06em}
:where(.cmod) .card h3{margin-bottom:8px}
:where(.cmod) .card small{border-top-color:var(--hair);margin-top:14px}
:where(.cmod) .rule strong{font-size:var(--fs-title);margin-bottom:8px}
:where(.cmod) .rule b{font-family:var(--sub);font-size:var(--fs-sub);margin:0 0 6px}
:where(.cmod) .statrow{gap:16px}
:where(.cmod) .statrow div{position:relative;border:1px solid var(--hair);border-radius:var(--r);padding:24px 22px 20px;background:#fff}
:where(.cmod) .statrow div:before{content:"";position:absolute;left:22px;top:-1px;width:28px;height:2px;background:var(--brand)}
:where(.cmod) .statrow strong{margin-bottom:6px}
:where(.cmod) .statrow span{display:block;line-height:1.7;color:var(--text)}
:where(.cmod) .flowrow{gap:12px;margin-bottom:22px}
:where(.cmod) .flowrow>div{padding:18px 20px}
:where(.cmod) .flowrow>div b{font-family:var(--sub);font-size:var(--fs-sub);margin-bottom:2px}
:where(.cmod) .flowrow>div.on,:where(.cmod) .fwbox.out{background:linear-gradient(155deg,var(--brand) 0,var(--brand-strong) 100%);border-color:transparent;box-shadow:0 1px 2px rgba(23,88,125,.14),0 10px 26px rgba(23,88,125,.14)}
:where(.cmod) .mapkeys button,:where(.cmod) .steps button{border-radius:12px;transition:background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),box-shadow .25s var(--ease)}
:where(.cmod) .mapkeys button:not([aria-pressed=true]):hover,:where(.cmod) .steps button:not([aria-pressed=true]):hover{border-color:#9bc1d6;background:var(--tint)}

/* 5 列表、步骤条、表格、提示块：列表与表格同一种“上墨线、行间细线、收尾线” */
:where(.cmod) .whylist,:where(.cmod) .ladder{border-top:1px solid var(--ink)}
:where(.cmod) .whylist li,:where(.cmod) .ladder li{grid-template-columns:40px minmax(0,1fr);align-items:center;padding:13px 0;border-bottom-color:var(--hair)}
:where(.cmod) .ladder li{grid-template-columns:40px minmax(0,1fr) auto}
:where(.cmod) .whylist li:last-child,:where(.cmod) .ladder li:last-child{border-bottom-color:var(--rule)}
:where(.cmod) .whylist li p,:where(.cmod) .ladder li p{margin-top:0}
:where(.cmod) .whylist .num,:where(.cmod) .ladder .num{width:26px;height:26px;display:grid;place-items:center;border:1px solid #9bc1d6;border-radius:50%;color:var(--brand-strong);background:#fff}
:where(.cmod) .whylist strong,:where(.cmod) .ladder strong{font-family:var(--sub);font-size:var(--fs-sub)}
:where(.cmod) .pipe li{padding:24px 20px 6px 0}
:where(.cmod) .pipe li:before{box-shadow:0 0 0 4px #fff,0 0 0 5px #bfd6e3}
.ppage>.cmod:nth-of-type(even) .pipe li:before{box-shadow:0 0 0 4px var(--herobg),0 0 0 5px #bfd6e3}
:where(.cmod) .pipe .num,:where(.cmod) .hyps .num{font-size:var(--fs-text);letter-spacing:.04em}
:where(.cmod) .pipe strong{font-family:var(--sub);font-size:var(--fs-sub);margin:6px 0 4px}
:where(.cmod) .pipe em{margin-top:10px;padding-top:8px;border-top:1px dashed #bfd6e3}
:where(.cmod) .hyps li{border-bottom-color:var(--hair)}
:where(.cmod) .layers li{border-color:var(--hair);border-left-color:var(--brand);border-radius:12px;padding:20px 24px}
:where(.cmod) .layers .num{font-size:var(--fs-sub);line-height:1.5;letter-spacing:.06em}
:where(.cmod) .layers b{font-family:var(--sub);font-size:var(--fs-sub);margin-bottom:2px}
:where(.cmod) .decision{border-left:0;border-radius:var(--r);padding:20px 24px 22px}
:where(.cmod) .decision small{display:inline-block;margin-bottom:10px;padding:1px 12px;border-radius:999px;background:#fff;color:var(--brand-strong);letter-spacing:.1em}
:where(.cmod) .decision li::marker,:where(.cmod) .obs li::marker,.rcrole li::marker,.rcretro li::marker{color:var(--brand)}
:where(.cmod) .take{padding:2px 0 2px 18px}
:where(.cmod) .tiers tbody th{white-space:nowrap}
@media(min-width:1101px){:where(.cmod) .pipe{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}}
@media(min-width:761px){
  .cmod>:not(.cmod-head,.figtag,h3)+.tscroll{margin-top:34px}
  .cmod .tscroll>table:not(.dtable){border-top:1px solid var(--ink)}
  .cmod .tscroll>table:not(.dtable) th,.cmod .tscroll>table:not(.dtable) td{padding:14px 20px 14px 0;border-bottom-color:var(--hair)}
  .cmod .tscroll>table:not(.dtable) thead th{padding-top:11px;padding-bottom:11px;letter-spacing:.06em;border-bottom-color:var(--rule)}
  .cmod .tscroll>table:not(.dtable) tbody tr:last-child>*{border-bottom-color:var(--rule)}
}

/* 6 窄屏：留白收紧；概述卡先两列（核心问题通栏）再单列；图版与卡片内距变小 */
@media(max-width:1100px){
  .cmod{padding:60px 0 64px}
  .rcbrief{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rcbrief .rcq{grid-column:1/-1}
}
@media(max-width:760px){
  .cmod{padding:44px 0 48px}
  .cmod-head{grid-template-columns:30px minmax(0,1fr);gap:14px 8px;margin-bottom:22px}
  .cmod-head .num{padding:0}
  .cmod h3.sub{margin:34px 0 14px}
  .rcbrief{grid-template-columns:minmax(0,1fr);gap:12px;padding:24px 0 6px}
  .rcbrief section{padding:18px 18px 20px}
  :where(.cmod) .cgrid figure,:where(.cmod) .calc-out,:where(.cmod) .chartbox,:where(.cmod) .panel{--fp:16px}
  :where(.cmod) .card,:where(.cmod) .rule div{padding:20px 20px 22px}
  :where(.cmod) .statrow{gap:10px}
  :where(.cmod) .statrow div{padding:20px 18px 16px}
  :where(.cmod) .statrow div:before{left:18px}
  :where(.cmod) .decision{padding:18px 18px 20px}
  :where(.cmod) .layers li{padding:18px 18px}
  .cmod .wide tr{border-color:var(--hair);border-radius:var(--r)}

/* ---------- 迭代 094：人体图的四条引线与方向标签（描出、漂浮、流光）；首屏按钮用白色板块的材质 ---------- */
/* 首屏的联系按钮与方向标签：与下面经历方框同一套材质——极淡的渐变白、细线、略深的下沿、三层阴影。
   --panel-shadow 的最远一层是给大方框配的（向内收 12px），放到 28px 的小按钮上几乎看不见，所以另配一档按钮用的尺寸 */
:root{--panel-shadow-sm:0 1px 1px rgba(31,80,120,.05),0 2px 4px rgba(31,80,120,.05),0 7px 12px -5px rgba(31,80,120,.2);--panel-shadow-sm-hover:0 1px 1px rgba(31,80,120,.06),0 3px 7px rgba(31,80,120,.07),0 11px 18px -6px rgba(31,80,120,.27);--panel-shadow-on:0 1px 1px rgba(23,88,125,.14),0 2px 5px rgba(31,111,156,.16),0 9px 16px -6px rgba(31,111,156,.42)}
.socials a,.vlabel{background:var(--panel-bg);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--panel-line);border-bottom-color:var(--panel-edge);box-shadow:var(--panel-shadow-sm)}
.vlabel:hover{border-color:#d3dfe8;border-bottom-color:#c6d5e0;color:var(--brand-strong);box-shadow:var(--panel-shadow-sm-hover)}
.socials a:hover,.socials a:focus-visible,.vlabel[aria-pressed=true]{background:var(--brand);border-color:var(--brand);border-bottom-color:var(--brand-strong);color:#fff;box-shadow:var(--panel-shadow-on)}
.vlabel[aria-pressed=true]{animation:vpress 1.6s var(--ease) 1}
@keyframes vpress{0%{box-shadow:var(--panel-shadow-on),0 0 0 0 #1f6f9c66}100%{box-shadow:var(--panel-shadow-on),0 0 0 10px #1f6f9c00}}
/* 引线：细线由锚点处的品牌蓝渐变到标签处的浅蓝；锚点是一枚白底蓝环，间歇向外漾开一圈；一粒流光沿线从身体走向标签 */
.vit svg.vcalls{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.vcalls g,.vcalls circle{transform-box:view-box;transform-origin:0 0}
.vcalls .vln,.vcalls .vgl{fill:none;stroke-linecap:round;stroke-linejoin:round}
.vcalls .vln{stroke-width:1.15;transition:stroke-width .3s}
.vcalls .vgl{stroke:var(--brand);stroke-width:2;stroke-dasharray:11 2000;opacity:0;animation:vglint 8s linear calc(var(--vld,.15s) + 1.9s + var(--k,0) * 2s) infinite}
.vcalls .vring{fill:#fff;stroke:var(--brand);stroke-width:1.1;transition:fill .3s}
.vcalls .vdot{fill:var(--brand);transition:fill .3s}
.vcalls .vping{fill:none;stroke:var(--brand);stroke-width:.9;vector-effect:non-scaling-stroke;opacity:0;animation:vping 8s ease-out calc(var(--vld,.15s) + 1.9s + var(--k,0) * 2s) infinite}
/* 流光：s 是光点沿整条线走过的路程（0→440，比最长的一条线略长），两段共用，所以在接头处是连续的；走完后隐藏，等下一轮 */
@keyframes vglint{0%{opacity:.9;stroke-dashoffset:calc(var(--o) + 11px)}34%{opacity:.9;stroke-dashoffset:calc(var(--o) - 429px)}34.01%,100%{opacity:0;stroke-dashoffset:calc(var(--o) - 429px)}}
@keyframes vping{0%{transform:scale(1);opacity:.6}20%,100%{transform:scale(3.4);opacity:0}}
/* 描出：同样按路程 s（0→整条线长 --lt）显露，斜线先出、水平段接着出 */
@keyframes vdraw{from{stroke-dasharray:2000 2000;stroke-dashoffset:calc(2000px + var(--o))}to{stroke-dasharray:2000 2000;stroke-dashoffset:calc(2000px + var(--o) - var(--lt))}}
@keyframes vnodein{from{opacity:0;transform:scale(.2)}}
@keyframes vlabin{from{opacity:0;scale:.9}}
/* 进场（每次画出主页时播一遍，vlin 在播完后去掉）：锚点先出现，线从身体描向标签，线快到时标签浮现；四个方向依次错开 0.12 秒。
   第一次打开网页时等人体图的进场动作快结束再开始（--vld 由 heroArt 写在 .vit 上）。窄屏没有引线，标签依次浮现 */
.vlabel{--vlabd:calc(var(--vld,.15s) + var(--i,0) * 70ms)}
.vlin .vcalls .vnode{animation:vnodein .4s var(--ease) calc(var(--vld,.15s) + var(--k,0) * 120ms) backwards}
.vlin .vcalls .vln{animation:vdraw .8s cubic-bezier(.4,0,.2,1) calc(var(--vld,.15s) + var(--k,0) * 120ms + 60ms) backwards}
.vlin .vlabel{animation:vlabin .5s var(--ease) var(--vlabd) backwards}
/* 漂浮（宽屏才有引线）：标签缓缓上下浮动约 ±3px，引线的水平段跟着标签走、斜线绕锚点摆动，四个方向的周期与起点各不相同。
   标签的位移用 cqw 换算成与 SVG 里 4.2 个单位相同的距离（4.2 ÷ 592 × 100cqw），所以线头始终对着标签；不支持 cqw 的旧浏览器不漂浮 */
@supports (width:1cqw){@media(min-width:901px){
.vfig{container-type:inline-size}
.vl0,.vc0{--fd:3.1s;--fp:-.6s}.vl1,.vc1{--fd:3.7s;--fp:-2.2s}.vl2,.vc2{--fd:3.4s;--fp:-1.4s}.vl3,.vc3{--fd:2.9s;--fp:-3s}
.vlabel{--vlabd:calc(var(--vld,.15s) + var(--k,0) * 120ms + .5s);will-change:translate;animation:vfloatL var(--fd,3.2s) ease-in-out var(--fp,0s) infinite alternate}
.vlabel[aria-pressed=true]{animation:vfloatL var(--fd,3.2s) ease-in-out var(--fp,0s) infinite alternate,vpress 1.6s var(--ease) 1}
.vlin .vlabel{animation:vfloatL var(--fd,3.2s) ease-in-out var(--fp,0s) infinite alternate,vlabin .5s var(--ease) var(--vlabd) backwards}
.vcalls .vtail{animation:vfloatT var(--fd,3.2s) ease-in-out var(--fp,0s) infinite alternate}
.vcalls .vstem{animation:vfloatS var(--fd,3.2s) ease-in-out var(--fp,0s) infinite alternate}
/* 指到或用键盘聚焦到一个标签时，它和它的引线停住不漂（漂浮排在动画列表第一位，后面的点按、进场动画照常播放），移开后从原处继续 */
.vlabel:hover,.vlabel:focus-visible{animation-play-state:paused,running}
.vit:has(.vl0:is(:hover,:focus-visible)) .vc0 :is(.vtail,.vstem),.vit:has(.vl1:is(:hover,:focus-visible)) .vc1 :is(.vtail,.vstem),.vit:has(.vl2:is(:hover,:focus-visible)) .vc2 :is(.vtail,.vstem),.vit:has(.vl3:is(:hover,:focus-visible)) .vc3 :is(.vtail,.vstem){animation-play-state:paused}
}}
/* 人体图滚出屏幕后（watchVit 加上 vpause）暂停这些循环动画，回到屏幕内从原处继续 */
.vit.vpause .vcalls *,.vit.vpause .vlabel{animation-play-state:paused}
@keyframes vfloatL{from{translate:0 -.7095cqw}to{translate:0 .7095cqw}}
@keyframes vfloatT{from{transform:translateY(-4.2px)}to{transform:translateY(4.2px)}}
@keyframes vfloatS{from{transform:skewY(calc(-1 * var(--sk)))}to{transform:skewY(var(--sk))}}

/* 迭代 096：总览默认展示全部；连贯的标签底色与白色内容区相接。 */
.section-page-title{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.section-switcher{margin-inline:-64px;padding:10px 0 0;background:var(--herobg);box-shadow:none;clip-path:inset(0)}
.section-tabs{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0;padding:6px 0 0;isolation:isolate}
.section-tab-indicator{position:absolute;z-index:-1;left:0;top:6px;bottom:-1px;background:#fff;border-radius:16px 16px 0 0;pointer-events:none}
.section-tab-indicator:before,.section-tab-indicator:after{content:"";position:absolute;bottom:1px;width:16px;height:16px;pointer-events:none}
.section-tab-indicator:before{left:-16px;background:radial-gradient(circle at 0 0,transparent 15.5px,#fff 16px)}
.section-tab-indicator:after{right:-16px;background:radial-gradient(circle at 100% 0,transparent 15.5px,#fff 16px)}
.section-tabs.is-ready .section-tab-indicator{transition:transform .38s cubic-bezier(.22,.8,.2,1),width .38s cubic-bezier(.22,.8,.2,1)}
.section-tabs [data-section-tab]{position:relative;min-width:0;min-height:54px;padding:14px 14px 17px;border:0;border-radius:16px 16px 0 0;background:transparent;color:var(--muted);font-family:var(--sub);font-size:var(--fs-sub);line-height:1.5;text-align:center;cursor:pointer;transition:color .28s}
.section-tabs [data-section-tab]:hover,.section-tabs [data-section-tab][aria-current=location]{color:var(--ink)}
.section-tabs [data-section-tab]:focus-visible{outline:2px solid var(--brand);outline-offset:-5px}
.section-overview{display:flex;align-items:center;justify-content:center;gap:8px}.section-overview-label{min-width:0}
.section-overview svg{display:block;flex:0 0 18px;width:18px;height:18px;margin:0;fill:none;stroke:currentColor;stroke-width:1.6;transition:stroke-width .28s}
.section-overview[aria-current=location] svg{stroke-width:1.9}
.section-content{background:#fff;min-height:240px}
.section-panel{padding-top:30px;margin:0 0 60px}
.section-panel[hidden]{display:none}
.section-panel>.port-head{scroll-margin-top:110px}

@media(max-width:760px){.section-overview{gap:6px}.section-overview:lang(en){flex-direction:column;gap:2px}.section-switcher{margin-inline:-20px;padding-top:10px}.section-tabs [data-section-tab]{padding:12px 6px 16px;min-height:52px;white-space:normal;overflow-wrap:anywhere}.section-panel{padding-top:26px}.section-panel>.port-head{scroll-margin-top:125px}}
@media(prefers-reduced-motion:reduce){.section-tabs.is-ready .section-tab-indicator,.section-tabs [data-section-tab]{transition:none}}
@media print{.section-panel[hidden]{display:block}.section-switcher{display:none}}

/* ---------- 迭代 099：人体图的方向高亮——不再用大片蓝色涂抹，改成“深浅分层”：这个方向保持原来的深度并用细线勾出，其余部分变浅退后 ---------- */
/* 只用页面自己的品牌蓝，不铺色块、不引入别的颜色。指到、键盘聚焦或选中一个方向时：
   · 一层与首屏底色相同的薄纱（vveil）盖住这个方向以外的部分，让它们变浅；这个部位本身不盖，保持原来的深度；
   · 细线勾出这个部位：vhi0 大脑外漾开的一圈、vhi1 镜片细环与两耳旁三道由深到浅的弧、vhi2 躯干与双腿的外轮廓加几处量度短线、vhi3 四只手外的双层细环；
     细线下垫一道白边（vcase），轮廓外一圈很淡的柔光（vglow）；
   · 其余三条引线也变浅。「多模态」是全身，联动另外三组细线（淡一些），不加薄纱。
   正指着别的方向时，已选中的那组先让开，只显示指着的那一组 */
.vhi,.vveil{opacity:0;transition:opacity .4s var(--ease)}
.vveil{fill:var(--herobg)}
.vhi .vedge{fill:none;stroke:var(--brand);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.vhi .vcase{fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.vhi .vglow{fill:none;stroke:#4a9fd0;stroke-width:5;opacity:.28}
.vhi .vtick{fill:none;stroke:var(--brand);stroke-width:.9;stroke-linecap:round;opacity:.75}
.vhi .vfaint{stroke-width:.7;opacity:.45}
.vhi .vrip{fill:none;stroke:var(--brand);stroke-width:.9;vector-effect:non-scaling-stroke;opacity:0}
.vhi .va1{--a:.95;stroke-width:1.25;stroke-opacity:.95}.vhi .va2{--a:.6;stroke-width:1.05;stroke-opacity:.6}.vhi .va3{--a:.32;stroke-width:.9;stroke-opacity:.32}
.vcalls .vcall{transition:opacity .35s var(--ease)}
/* 选中 */
.vit[data-active="0"] .vhi0,.vit[data-active="1"] .vhi1,.vit[data-active="2"] .vhi2,.vit[data-active="3"] .vhi3{opacity:1}
.vit[data-active="3"] :is(.vhi0,.vhi1,.vhi2){opacity:.6}
.vit[data-active="0"] .vv0,.vit[data-active="1"] .vv1,.vit[data-active="2"] .vv2{opacity:var(--vveil,.42)}
.vit:not([data-active="-1"]) .vcall{opacity:.45}
.vit[data-active="0"] .vc0,.vit[data-active="1"] .vc1,.vit[data-active="2"] .vc2,.vit[data-active="3"] .vcall{opacity:1}
/* 指到或聚焦：先收起已选中的那组，再显示指着的这一组 */
.vit:has(.vlabel:focus-visible) :is(.vhi,.vveil){opacity:0}
@media(hover:hover){.vit:has(.vlabel:hover) :is(.vhi,.vveil){opacity:0}}
.vit:has(.vlabel:focus-visible) .vcall{opacity:.45}
@media(hover:hover){.vit:has(.vlabel:hover) .vcall{opacity:.45}}
.vit:has(.vl0:focus-visible) .vhi0,.vit:has(.vl1:focus-visible) .vhi1,.vit:has(.vl2:focus-visible) .vhi2,.vit:has(.vl3:focus-visible) .vhi3{opacity:1}
@media(hover:hover){.vit:has(.vl0:hover) .vhi0,.vit:has(.vl1:hover) .vhi1,.vit:has(.vl2:hover) .vhi2,.vit:has(.vl3:hover) .vhi3{opacity:1}}
.vit:has(.vl3:focus-visible) :is(.vhi0,.vhi1,.vhi2){opacity:.6}
@media(hover:hover){.vit:has(.vl3:hover) :is(.vhi0,.vhi1,.vhi2){opacity:.6}}
.vit:has(.vl0:focus-visible) .vv0,.vit:has(.vl1:focus-visible) .vv1,.vit:has(.vl2:focus-visible) .vv2{opacity:var(--vveil,.42)}
@media(hover:hover){.vit:has(.vl0:hover) .vv0,.vit:has(.vl1:hover) .vv1,.vit:has(.vl2:hover) .vv2{opacity:var(--vveil,.42)}}
.vit:has(.vl0:focus-visible) .vc0,.vit:has(.vl1:focus-visible) .vc1,.vit:has(.vl2:focus-visible) .vc2,.vit:has(.vl3:focus-visible) .vc3{opacity:1}
@media(hover:hover){.vit:has(.vl0:hover) .vc0,.vit:has(.vl1:hover) .vc1,.vit:has(.vl2:hover) .vc2,.vit:has(.vl3:hover) .vc3{opacity:1}}
/* 显示时的细微动态：细环向外漾开一圈；耳旁的弧由里到外依次亮一下；轮廓外的柔光缓缓呼吸。只在显示时运行 */
.vit[data-active="0"] .vhi0 .vrip,.vit[data-active="3"] :is(.vhi0,.vhi3) .vrip,.vit:has(.vl0:focus-visible) .vhi0 .vrip,.vit:has(.vl3:focus-visible) :is(.vhi0,.vhi3) .vrip{animation:vrip 2.8s ease-out calc(var(--j,0) * .3s) infinite}
@media(hover:hover){.vit:has(.vl0:hover) .vhi0 .vrip,.vit:has(.vl3:hover) :is(.vhi0,.vhi3) .vrip{animation:vrip 2.8s ease-out calc(var(--j,0) * .3s) infinite}}
.vit[data-active="1"] .vhi1 [class*=" va"],.vit[data-active="3"] .vhi1 [class*=" va"],.vit:has(.vl1:focus-visible) .vhi1 [class*=" va"],.vit:has(.vl3:focus-visible) .vhi1 [class*=" va"]{animation:vwave 2.1s ease-in-out infinite}
@media(hover:hover){.vit:has(.vl1:hover) .vhi1 [class*=" va"],.vit:has(.vl3:hover) .vhi1 [class*=" va"]{animation:vwave 2.1s ease-in-out infinite}}
.vhi .va2{animation-delay:.22s!important}.vhi .va3{animation-delay:.44s!important}
.vit[data-active="2"] .vhi2 .vglow,.vit[data-active="3"] .vhi2 .vglow,.vit:has(.vl2:focus-visible) .vhi2 .vglow,.vit:has(.vl3:focus-visible) .vhi2 .vglow{animation:vbreath 2.6s ease-in-out infinite alternate}
@media(hover:hover){.vit:has(.vl2:hover) .vhi2 .vglow,.vit:has(.vl3:hover) .vhi2 .vglow{animation:vbreath 2.6s ease-in-out infinite alternate}}
@keyframes vrip{0%{transform:scale(1);opacity:.6}75%,100%{transform:scale(1.6);opacity:0}}
@keyframes vwave{0%,55%,100%{stroke-opacity:var(--a)}22%{stroke-opacity:1}}
@keyframes vbreath{from{opacity:.16}to{opacity:.36}}
/* 引线：指到或选中时叠上一条实的品牌蓝（vlw），锚点填实；选中时重描一遍。底下的渐变细线（vln）不变；「多模态」选中时联动四条线 */
.vcalls .vlw{fill:none;stroke:var(--brand);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .3s}
.vit[data-active="0"] .vc0 .vlw,.vit[data-active="1"] .vc1 .vlw,.vit[data-active="2"] .vc2 .vlw,.vit[data-active="3"] .vcall .vlw,.vit:has(.vl0:focus-visible) .vc0 .vlw,.vit:has(.vl1:focus-visible) .vc1 .vlw,.vit:has(.vl2:focus-visible) .vc2 .vlw,.vit:has(.vl3:focus-visible) .vc3 .vlw{opacity:1}
@media(hover:hover){.vit:has(.vl0:hover) .vc0 .vlw,.vit:has(.vl1:hover) .vc1 .vlw,.vit:has(.vl2:hover) .vc2 .vlw,.vit:has(.vl3:hover) .vc3 .vlw{opacity:1}}
.vit[data-active="0"] .vc0 .vlw,.vit[data-active="1"] .vc1 .vlw,.vit[data-active="2"] .vc2 .vlw,.vit[data-active="3"] .vc3 .vlw{animation:vdraw .7s var(--ease) backwards}
.vit[data-active="0"] .vc0 .vring,.vit[data-active="1"] .vc1 .vring,.vit[data-active="2"] .vc2 .vring,.vit[data-active="3"] .vcall .vring,.vit:has(.vl0:focus-visible) .vc0 .vring,.vit:has(.vl1:focus-visible) .vc1 .vring,.vit:has(.vl2:focus-visible) .vc2 .vring,.vit:has(.vl3:focus-visible) .vc3 .vring{fill:var(--brand)}
@media(hover:hover){.vit:has(.vl0:hover) .vc0 .vring,.vit:has(.vl1:hover) .vc1 .vring,.vit:has(.vl2:hover) .vc2 .vring,.vit:has(.vl3:hover) .vc3 .vring{fill:var(--brand)}}
.vit[data-active="0"] .vc0 .vdot,.vit[data-active="1"] .vc1 .vdot,.vit[data-active="2"] .vc2 .vdot,.vit[data-active="3"] .vcall .vdot,.vit:has(.vl0:focus-visible) .vc0 .vdot,.vit:has(.vl1:focus-visible) .vc1 .vdot,.vit:has(.vl2:focus-visible) .vc2 .vdot,.vit:has(.vl3:focus-visible) .vc3 .vdot{fill:#fff}
@media(hover:hover){.vit:has(.vl0:hover) .vc0 .vdot,.vit:has(.vl1:hover) .vc1 .vdot,.vit:has(.vl2:hover) .vc2 .vdot,.vit:has(.vl3:hover) .vc3 .vdot{fill:#fff}}
/* 大脑：指到时很浅的蓝底加品牌蓝细线，选中时填实品牌蓝、沟回留白 */
.vit[data-active="3"] .vbrain .lobe,.vit:not([data-active="0"]):has(.vl0:focus-visible) .vbrain .lobe,.vit:not([data-active="0"]):has(.vl3:focus-visible) .vbrain .lobe{fill:#e3f0f8;stroke:var(--brand);stroke-width:.75;opacity:1}
@media(hover:hover){.vit:not([data-active="0"]):has(.vl0:hover) .vbrain .lobe,.vit:not([data-active="0"]):has(.vl3:hover) .vbrain .lobe{fill:#e3f0f8;stroke:var(--brand);stroke-width:.75;opacity:1}}
.vit[data-active="3"] .vbrain .fold,.vit:not([data-active="0"]):has(.vl0:focus-visible) .vbrain .fold,.vit:not([data-active="0"]):has(.vl3:focus-visible) .vbrain .fold{stroke:var(--brand);opacity:.85}
@media(hover:hover){.vit:not([data-active="0"]):has(.vl0:hover) .vbrain .fold,.vit:not([data-active="0"]):has(.vl3:hover) .vbrain .fold{stroke:var(--brand);opacity:.85}}
.vit[data-active="0"] .vbrain .lobe{fill:var(--brand);stroke:#fff;stroke-width:.7;opacity:1}

function validate(v){
  if(!v||typeof v!=='object'||Array.isArray(v))throw Error('内容格式不正确');
  const o={};
  for(const k of Object.keys(original)){
    let val=v[k];
    if(val===undefined)val=structuredClone(original[k]);/* 兼容旧版本的备份 */
    if(Array.isArray(original[k])){
      if(!LISTS[k]||!Array.isArray(val)||val.length>50||(LISTS[k].fixed&&val.length!==original[k].length))throw Error('列表格式不正确');
      o[k]=val.map(x=>{
        if(!x||typeof x!=='object')throw Error('项目格式不正确');
        const item={};
        for(const f of itemFields(k)){
          let s=x[f]===undefined?'':x[f];
          if(f==='image'&&typeof s==='string'&&s.startsWith('__orig__'))s=original[k][Number(s.slice(8))]?.image||'';
          if(typeof s!=='string'||s.length>(f==='image'?MAX_IMG:30000))throw Error('内容字段不正确');
          if(f==='image'&&s&&!isImg(s))throw Error('图片格式不正确');
          if(f==='logo'&&x[f]===undefined){const m=original[k].find(y=>y.title===x.title);s=(m&&m.logo)||''}
          item[f]=s;
        }
        return item;
      });
    }else{
      if(k==='photo'&&val==='__original_photo__')val=original.photo;
      if(typeof val!=='string'||val.length>(k==='photo'?20000000:30000))throw Error('基本信息格式不正确');
      o[k]=val;
    }
  }
  /* 每个项目都要有一个不重复的编号。旧备份没有编号时，按标题对应原稿的编号；对不上的另起一个。 */
  const seen=new Set();
  o.projects.forEach(p=>{let id=(p.id||'').trim().replace(/[^\w-]/g,'');if(!id){const m=original.projects.find(q=>q.id&&q.title===p.title);id=m?m.id:''}if(!id||seen.has(id)){const base=id||'p';let n=1;do{id=base+'-'+(n++)}while(seen.has(id)||original.projects.some(q=>q.id===id))}seen.add(id);p.id=id});
  return o;
}
/* 存入浏览器草稿时，文件里已有的照片和图片只记引用，避免占满浏览器存储。 */
function pack(d){
  const o={...d,photo:d.photo&&d.photo===original.photo?'__original_photo__':d.photo};
  for(const k of IMG_LISTS)o[k]=d[k].map(x=>{if(!x.image)return x;const j=original[k].findIndex(y=>y.image===x.image);return j<0?x:{...x,image:'__orig__'+j}});
  return o;
}

  const G=[...q('.vgc'),...q('.vgs')],W=q('.vwho'),F=q('.vfront'),O=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
  let done=false;
  const set=t=>{const x=Math.min(1,Math.max(0,t/1200)),p=E(x),o=E(Math.min(1,x/.3));
    /* 两肩前的躯干：手臂抬到 30%–80% 之间平滑淡掉 */
    const k=Math.min(1,Math.max(0,(p-.3)/.5)),fo=String(+(1-k*k*(3-2*k)).toFixed(4));for(const el of F)el.setAttribute('opacity',fo);
    for(const[els,fn]of T){const val=fn(p);for(const el of els)el.setAttribute('transform',val)}
    for(const el of G)el.setAttribute('opacity',String(+o.toFixed(4)));
    const wo=String(+O(t/600).toFixed(4)),ws=`translate(200 215) scale(${+(.95+.05*O(t/900)).toFixed(5)}) translate(-200 -215)`;
    for(const el of W){el.setAttribute('opacity',wo);el.setAttribute('transform',ws)}};
  const end=()=>{if(done)return;done=true;for(const[els]of T)for(const el of els)el.removeAttribute('transform');for(const el of [...G,...W])el.removeAttribute('opacity');for(const el of W)el.removeAttribute('transform');for(const el of F)el.remove();s.querySelector('#vshoulder')?.remove()};

}
/* 技能框（迭代 014 加在人体图下方，迭代 018 按本人要求不再显示；数据仍保留）。 */
function skillsMarkup(){return data.skills.length?`<ul class="vskills" aria-label="${B('技能','Skills')}">${data.skills.map(s=>`<li><b>${esc(L(s,'title'))}</b><span>${L(s,'text').split(/[、,，]/).map(x=>x.trim()).filter(Boolean).map(esc).join('<i aria-hidden="true"> · </i>')}</span></li>`).join('')}</ul>`:''}
/* 还没有内容的项目（没有图示案例页，也没有填写任何说明）只显示卡片，不做成链接。 */
/* 项目的图片：每行一张，可以在路径后写「 | 图片说明」。项目的链接：每行一个，写成「名称 | 链接」，只写链接也可以。 */
const galleryOf=p=>String(p.gallery||'').split(/\r?\n/).map(l=>{const[a,...b]=l.split('|');return{src:a.trim(),cap:b.join('|').trim()}}).filter(g=>isImg(g.src));
const linksOf=p=>String(p.url||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf('|');if(i<0)return{name:'',url:safeUrl(l)};const[zh,en]=l.slice(0,i).split(' // ').map(x=>x.trim());return{name:B(zh,en||zh),url:safeUrl(l.slice(i+1).trim())}}).filter(l=>l.url);
const hasPage=p=>!!caseOf(p)||['summary','question','role','approach','evidence'].some(f=>(p[f]||'').trim())||linksOf(p).length>0||galleryOf(p).length>0;
/* 卡片：封面、类型、性质与时间、标题，和一句「做了什么」。 */
/* 迭代 074：卡片只留三行文字——标题、简介、底行。原来标题上方的分类大多重复标题、简介或分组标题，
   只保留“·”前的领域（外骨骼、汽车座舱等，标题和简介里通常没有），并入底行：“外骨骼 · 在职项目”；与性质相同时（硕士论文）只写一次 */
const cardField=p=>{const c=L(p,'category')||'',i=c.indexOf(' · ');return i>0?c.slice(0,i):''};
const cardMeta=p=>{const f=cardField(p),s=L(p,'status')||'',fd=f&&f!==s?`<span class="pfield">${esc(f)}${s?' · ':''}</span>`:'';return `<div class="projectmeta"><span class="when">${fd||s?`<span class="status">${fd}${esc(s)}</span>`:''}${p.date?`<span class="date">${esc(p.date)}</span>`:''}</span></div>`};
const cardBrief=p=>L(p,'brief')?`<p class="brief">${esc(L(p,'brief'))}</p>`:'';
const projectCard=(p,i)=>hasPage(p)
  ?`<article class="project" data-index="${i}"><a class="projectvisual" href="${href(i)}" tabindex="-1" aria-hidden="true">${cover(p,i)}</a><h3><a href="${href(i)}">${esc(L(p,'title'))}</a></h3>${cardBrief(p)}${cardMeta(p)}</article>`
  :`<article class="project nolink" data-index="${i}"><div class="projectvisual" aria-hidden="true">${cover(p,i)}</div><h3>${esc(L(p,'title'))}</h3>${cardBrief(p)}${cardMeta(p)}</article>`;
/* 在人体图上选了方向之后，首屏下方列出该方向的全部项目：只占一行，放不下时横向滑动（触摸板、滚动条，或标题右侧的两个箭头）；再点一次收起。 */
function dirMarkup(){const d=selectedDomain;if(d<0)return '';const dm=data.domains[d],list=domainProjects(d);
  /* 与项目页共用分类与项目集合；只显示标题、数量和浏览控件。 */
  const en=lang!=='en'&&dm.subtitle?`<i lang="en">${esc(dm.subtitle)}</i>`:'';
  return `<section class="section dirsec" aria-labelledby="dir-domain-title"><div class="dirhead"><h2 id="dir-domain-title">${esc(L(dm,'title'))}${en}<span>${B(list.length+' 个作品',list.length+(list.length===1?' work':' works'))}</span></h2><div class="dirtools"><button type="button" class="dirstep" data-dirstep="-1" aria-label="${B('向左滑动','Scroll left')}" hidden>${arw('l',1)}</button><button type="button" class="dirstep" data-dirstep="1" aria-label="${B('向右滑动','Scroll right')}" hidden>${arw('r',1)}</button><button type="button" class="dirclose" data-dirclose>${B('收起','Close')} ×</button></div></div><div class="dirrow">${list.map((i,k)=>projectCard(data.projects[i],i).replace('<article ',`<article style="--k:${k}" `)).join('')}</div></section>`}
/* 选方向：作品逐张淡入；收起时先淡出再清空。 */
let dirTimer=0;
function updateDomain(i){selectedDomain=selectedDomain===i?-1:i;$('.vit').dataset.active=domainParts[selectedDomain]??-1;$$('[data-domain]').forEach(b=>{const active=String(Number(b.dataset.domain)===selectedDomain);b.setAttribute('aria-pressed',active);b.setAttribute('aria-expanded',active)});const box=$('#dirprojects');clearTimeout(dirTimer);
  if(selectedDomain<0){const s=box.querySelector('.dirsec');const done=()=>{box.innerHTML='';dirSync=null};if(s&&!matchMedia('(prefers-reduced-motion: reduce)').matches){s.classList.add('out');dirTimer=setTimeout(done,220)}else done();return}
  box.innerHTML=dirMarkup();bindDirClose();if(selectedDomain>=0&&box.getBoundingClientRect().top>innerHeight-220)box.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'})}
/* 箭头只在一行放不下时出现；滑到头的那一侧变灰。 */
let dirSync=null;
function bindDirClose(){
  const b=$('[data-dirclose]');if(b)b.onclick=()=>{const i=selectedDomain;updateDomain(i);document.querySelector(`[data-domain="${i}"]`)?.focus()};
  const row=$('.dirrow'),steps=[...$$('[data-dirstep]')];dirSync=null;if(!row)return;
  dirSync=()=>{const max=row.scrollWidth-row.clientWidth;steps.forEach(s=>{s.hidden=max<=4;s.disabled=Number(s.dataset.dirstep)<0?row.scrollLeft<=2:row.scrollLeft>=max-2})};
  steps.forEach(s=>s.onclick=()=>row.scrollBy({left:Number(s.dataset.dirstep)*row.clientWidth*.8,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}));
  row.onscroll=dirSync;dirSync();
}

/* ---------- 简历：教育、工作、实习、项目、技能 ---------- */
const CV_LISTS=[['education','教育背景','Education'],['work','工作经历','Work experience'],['intern','实习经历','Internships'],['cvprojects','项目经历','Projects']];
/* 详情每行一条。写成「要点：说明」时，要点直接显示，说明在展开后显示。 */
function points(s){return String(s||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^([^：:，。；,;（(]{2,60})[：:]\s*(.+)$/);return m?{title:m[1].trim(),text:m[2]}:{title:'',text:l}})}
function cvRow(x,lg,tag){
  /* 教育：学位写成「本科 · 建筑学」时，「本科」作标签放在日期前，岗位位置只留专业 */
  let role=L(x,'role');
  if(!tag){const m=role.match(/^(.+?)\s*·\s*(.+)$/);if(m){tag={text:m[1]};role=m[2]}}
  const pts=points(L(x,'points')),keys=pts.filter(p=>p.title).map(p=>p.title);
  const rel=String(x.refs||'').split(/[,，\s]+/).filter(Boolean).map(tok=>indexOfId(idOf(tok))).filter(i=>i>=0&&hasPage(data.projects[i]));
  /* 第二行：填了「一行补充」就显示它（一句贡献，或 GPA 与奖项），否则显示详情里的要点 */
  const sub=L(x,'note')?`<span class="cvnote">${esc(L(x,'note'))}</span>`:keys.length?`<span class="cvkeys">${keys.map(esc).join('<i aria-hidden="true"> · </i>')}</span>`:'';
  const head=`<span class="cvmain"><strong>${esc(L(x,'title'))}</strong>${role?`<span class="cvrole">${esc(role)}</span>`:''}${L(x,'dept')?`<span class="cvdept">${esc(L(x,'dept'))}</span>`:''}</span><span class="cvperiod">${tag?`<span class="cvtag${tag.intern?' intern':''}">${esc(tag.text)}</span>`:''}<span class="cvdates">${esc(L(x,'period'))}</span></span>${sub}`;
  const refs=rel.length?`<p class="cvrefs">${rel.map(i=>`<a href="${href(i)}">${esc(L(data.projects[i],'title'))}${arw('r')}</a>`).join('')}</p>`:'';
  const logo=lg?`<span class="cvlogo" aria-hidden="true">${isImg(x.logo)?`<img src="${esc(x.logo)}" alt="">`:''}</span>`:'';
  if(!pts.length)return `<li class="cvrow${lg?' lg':''}">${logo}<div class="cvhead">${head}</div>${refs}</li>`;
  return `<li class="cvrow${lg?' lg':''}">${logo}<details class="cvmore"><summary class="cvhead">${head}</summary><div class="cvbody"><ul>${pts.map(p=>`<li>${p.title?`<strong>${esc(p.title)}</strong>`:''}${esc(p.text)}</li>`).join('')}</ul></div></details>${refs}</li>`;
}
/* 首屏以下是一张表：左列是栏目名，右列是内容。只有两节：教育背景，以及工作经历（正式工作和实习合在一起，每行一个标签）。
   项目经历、技能、个人陈述和精选作品不再放在主页，内容仍保留在文件数据里。 */
function cvMarkup(){
  const sec=(id,title,body)=>`<section class="cvsec" id="${id}"><h2>${title}</h2>${body}</section>`;
  const lg=['education','work','intern'].some(k=>data[k].some(x=>isImg(x.logo)));
  const job={text:B('正式工作','Full-time')},intern={text:B('实习','Internship'),intern:true};
  const work=[...data.work.map(x=>cvRow(x,lg,job)),...data.intern.map(x=>cvRow(x,lg,intern))].join('');
  /* 工作经历（含实习）在前，教育背景在后 */
  return (work?sec('cv-work',B('工作经历','Experience'),`<ol class="cvlist">${work}</ol>`):'')
    +(data.education.length?sec('cv-education',B('教育背景','Education'),`<ol class="cvlist">${data.education.map(x=>cvRow(x,lg)).join('')}</ol>`):'');
}

const ART_ORDER=Object.keys(ART);
function art(p,i){const v=(p.visual||'').trim().toLowerCase();return `<svg viewBox="0 0 338 220" aria-hidden="true">${ART[Object.hasOwn(ART,v)?v:ART_ORDER[i%ART_ORDER.length]]}</svg>`}
function cover(p,i){return isImg(p.image)?`<img class="cover" loading="lazy" src="${esc(p.image)}" alt="${esc(L(p,'title'))}">`:art(p,i)}

/* 图上方的小标签：示意数据 / 方案示意 */
const figtag=k=>`<p class="figtag">${k==='syn'?B('示意数据','Illustrative data'):B('方案示意','Concept sketch')}</p>`;
/* ---------- 图示案例页 ----------
   兼容性（compat）案例：方法与逻辑来自实际工作，图中的数值全部是示意数据，不含产品参数。 */
const CASES={};
const caseOf=p=>{const id=(p.caseId||'').trim();return Object.hasOwn(CASES,id)?CASES[id]:null};

/* 知识树叶子：每行一个，可写成「名称 | 链接」。 */
function leaves(s){return String(s||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf('|');return i<0?{name:l,url:''}:{name:l.slice(0,i).trim(),url:safeUrl(l.slice(i+1).trim())}}).filter(l=>l.name)}
/* 飞书文档：tools/feishu_sync.py 把链接到的飞书文档同步进 feishu/pages.js（双击「同步飞书.cmd」）。
   已同步、有正文的换成站内文章页 #/n/文档编号；同步时发现没有正文的不再给链接；从没同步过的保持原来的飞书链接。 */
const FS=window.FEISHU&&window.FEISHU.pages?window.FEISHU:null;
const fsTok=u=>{const m=String(u||'').match(/feishu\.cn\/(?:wiki|docx)\/([A-Za-z0-9]+)/);return m?m[1]:''};
/* 研究方法文章（迭代 024）：articles/*.md 由 tools/build_articles.py 生成 articles/articles.js，页面为 #/a/文章名；
   文章元数据里的 replaces 列出它取代的飞书文档，指向这些文档的链接一律改为指向本文。 */
const AR=window.ARTICLES||{};const arOf=t=>Object.keys(AR).find(k=>(AR[k].replaces||[]).includes(t));
const fsHref=u=>{const t=fsTok(u);if(t&&arOf(t))return '#/a/'+arOf(t);if(!t||!FS)return u;if(FS.pages[t])return '#/n/'+t;if((FS.empty||[]).includes(t))return '';return u};
function notePageMarkup(t){const p=FS.pages[t];return `<div class="wrap">${navMarkup('thinking')}<main id="main" class="spage fspage"><p class="fsback"><a href="#/thinking">${arw('l')}${secName('thinking')}</a></p><h1 class="pagetitle" id="pg-title" tabindex="-1">${esc(p.title)}</h1><p class="fsmeta">${B('笔记','Notes')} · ${B('更新于','Updated')} ${esc(FS.synced||'')}${lang==='en'?' · Written in Chinese':''}</p><article class="fsdoc" lang="zh-CN">${p.html}</article></main>${footerMarkup()}</div>`}
function articlePageMarkup(k){const a=AR[k];
  /* 迭代 059：正文按“读物”排版，只改呈现、不改文章内容——开头的「一句话」做成导语；小节标题拆出编号并加锚点；图注前加图号；
     宽屏时右侧有一份跟随滚动的本文目录（点击跳到小节，滚动时标出当前小节）。目录的点击与滚动监听在页面插入后绑定；离开文章页后，监听在下一次滚动时自行移除。 */
  const secs=[];let fig=0;
  const body=a.html
    .replace(/^\s*<blockquote><p><strong>([^<]{1,12})<\/strong>[：:]\s*/,(m,t)=>`<blockquote class="arlede"><p><span class="arkick">${t}<span class="sr">：</span></span>`)
    .replace(/<h2>([\s\S]*?)<\/h2>/g,(m,t)=>{const mm=t.match(/^(\d+)[.．]\s*([\s\S]+)$/),id='ar-s'+(secs.length+1),num=mm?mm[1].padStart(2,'0'):'',txt=mm?mm[2]:t;secs.push({id,num,txt:txt.replace(/<[^>]+>/g,'')});return `<h2 id="${id}" tabindex="-1">${num?`<span class="arnum">${num}</span>`:''}${txt}</h2>`})
    .replace(/<figcaption>/g,()=>`<figcaption><span class="arfign"${lang==='en'?' lang="en"':''}>${B('图','Fig.')} ${++fig}</span>`);
  const toc=secs.length>1?`<nav class="artoc" aria-label="${B('本文目录','On this page')}"><p class="artoc-h">${B('目录','Contents')}</p><ol>${secs.map(s=>`<li><button type="button" data-arjump="${s.id}"><span>${s.num}</span>${s.txt}</button></li>`).join('')}</ol></nav>`:'';
  requestAnimationFrame(()=>{
    removeEventListener('scroll',articlePageMarkup.spy);const nav=document.querySelector('.artoc');if(!nav)return;
    const btns=[...nav.querySelectorAll('[data-arjump]')],heads=btns.map(b=>document.getElementById(b.dataset.arjump));if(heads.some(h=>!h))return;
    btns.forEach((b,i)=>b.onclick=()=>{heads[i].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});heads[i].focus({preventScroll:true})});
    let cur=-2;const mark=()=>{if(!nav.isConnected){removeEventListener('scroll',mark);return}let on=-1;heads.forEach((h,i)=>{if(h.getBoundingClientRect().top<160)on=i});if(innerHeight+scrollY>=document.documentElement.scrollHeight-2)on=heads.length-1;if(on===cur)return;cur=on;btns.forEach((b,i)=>i===on?b.setAttribute('aria-current','true'):b.removeAttribute('aria-current'))};
    articlePageMarkup.spy=mark;addEventListener('scroll',mark,{passive:true});mark()});
  return `<div class="wrap">${navMarkup('thinking')}<main id="main" class="ppage arpage"><div class="pp-top band"><a class="pp-back" href="#/thinking">${arw('l')}${secName('thinking')}</a><header class="pp-head"><div class="pp-meta">${L(a,'tag').split(/\s*·\s*/).filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join('')}${lang==='en'?'<span>Written in Chinese</span>':''}</div><h1 id="pg-title" tabindex="-1">${esc(lang==='en'&&a.title_en?a.title_en:a.title)}</h1>${L(a,'summary')?`<p class="pp-lead">${esc(L(a,'summary'))}</p>`:''}</header></div><div class="arlayout">${toc}<article class="fsdoc ardoc" lang="zh-CN">${body}</article></div>${articleNav(k)}</main>${footerMarkup()}</div>`}
/* 文章之间的上一篇 / 下一篇：与设计页的「上一个 / 下一个」同一个组件，按 order 排序、首尾相接。 */
function articleNav(k){const ks=Object.keys(AR).sort((x,y)=>(AR[x].order??99)-(AR[y].order??99)),n=ks.length,at=ks.indexOf(k);if(n<2)return '';const pv=ks[(at+n-1)%n],nx=ks[(at+1)%n];return `<nav class="pp-nav" aria-label="${B('其他研究方法文章','Other method articles')}">${n>2?`<a href="#/a/${pv}"><small>${arw('l')}${B('上一篇','Previous')}</small>${esc(lang==='en'&&AR[pv].title_en?AR[pv].title_en:AR[pv].title)}</a>`:'<span></span>'}<a href="#/a/${nx}"><small>${B('下一篇','Next')}${arw('r')}</small>${esc(lang==='en'&&AR[nx].title_en?AR[nx].title_en:AR[nx].title)}</a></nav>`}
function treeMarkup(){return `<div class="tree"><div class="tree-root"><strong>${esc(L(data,'treeRoot'))}</strong><span>${esc(L(data,'treeRootNote'))}</span></div><div class="tree-branches">${data.tree.map((b,i)=>`<article class="branch"><div class="branch-head"><span class="num">${nn(i)}</span><div><h3>${esc(L(b,'title'))}</h3><small>${esc(b.subtitle)}</small></div></div><div class="branch-body"><ul class="leaves">${leaves(L(b,'leaves')).map(l=>({...l,url:fsHref(l.url)})).map(l=>l.url?(l.url[0]==='#'?`<li><a href="${esc(l.url)}">${esc(l.name)}</a></li>`:`<li><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.name)}${arw('ur')}</a></li>`):`<li class="plain"><span>${esc(l.name)}</span></li>`).join('')}</ul></div></article>`).join('')}</div></div>`}

function lifeIcon(cat){const k=/摄影|影像|photo/i.test(cat)?'camera':/展|exhibition/i.test(cat)?'exhibition':/文创|产品|手作|product/i.test(cat)?'product':/装置|艺术|installation|art/i.test(cat)?'installation':/日常|生活|旅行|阅读|everyday|life|journal/i.test(cat)?'journal':'image';return `<svg viewBox="0 0 120 90" aria-hidden="true" fill="none" stroke="#5486a2" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">${LIFE_ICONS[k]}</svg>`}
/* 图片栏目（生活与创作、艺术设计）：有图片的条目显示为图片，分类多于一种时可以筛选；还没有图片的只列出名称。 */
function galleryMarkup(key){
  const items=data[key].map((x,i)=>({x,i})),shown=items.filter(o=>isImg(o.x.image)),pending=items.filter(o=>!isImg(o.x.image));
  const label=x=>{const c=L(x,'category').trim(),n=L(x,'title').trim();return c&&c!==n?`${c} · ${n}`:n};
  const pend=pending.length?`<div class="lifepending"><ul class="chips">${pending.map(({x})=>`<li>${esc(label(x))}</li>`).join('')}</ul></div>`:'';
  if(!shown.length)return pend;
  const cats=[...new Set(shown.map(o=>L(o.x,'category').trim()).filter(Boolean))];if(!cats.includes(galFilter[key]))galFilter[key]='';
  const more=x=>safeUrl(x.url)?`<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${B('查看更多','More')}${arw('ur')}</a>`:'';
  const filters=cats.length>1?`<div class="filters" aria-label="${B('按类型筛选','Filter by type')}">${['',...cats].map(c=>`<button class="filter" data-galfilter="${key}" data-cat="${esc(c)}" aria-pressed="${c===galFilter[key]}">${esc(c||B('全部','All'))}</button>`).join('')}</div>`:'';
  return `${filters}<div class="lifegrid g-${key}" data-gallery="${key}">${shown.map(({x,i})=>`<figure class="lifeitem" data-item="${i}"><button class="lifeimg" data-galopen="${key}.${i}" aria-label="${esc(B('查看大图：','View larger: ')+L(x,'title'))}"><img src="${esc(x.image)}" alt="${esc(L(x,'title'))}"></button><figcaption><small>${esc(L(x,'category'))}</small><strong>${esc(L(x,'title'))}</strong>${L(x,'text')?`<p>${esc(L(x,'text'))}</p>`:''}${more(x)}</figcaption></figure>`).join('')}</div>${pend}`;
}

/* ---------- 页面框架：导航、语言切换、页脚 ---------- */
const PUBLIC_HOME_ONLY=true;
const SECTIONS=['projects','thinking','other'];
const secName=id=>({home:B('主页','Home'),projects:B('项目','Projects'),thinking:B('思考','Thinking'),other:B('其他','Other')})[id];
const secOf=p=>p.section==='other'||['建筑设计','艺术设计'].includes((p.group||'').trim())?'other':'projects';
/* 一个栏目里的项目按小类排在一起：小类按第一次出现的先后，小类内部按原有顺序。 */
const inSection=id=>data.projects.map((p,i)=>i).filter(i=>secOf(data.projects[i])===id);
const groupsOf=id=>{const out=[];for(const i of inSection(id)){const name=L(data.projects[i],'group').trim();let g=out.find(o=>o.name===name);if(!g)out.push(g={name,items:[]});g.items.push(i)}return out};
function navMarkup(cur){return `<header class="nav"><a class="brand" href="#">${esc(lang==='en'?data.english:data.name)}<span>${esc(lang==='en'?data.name:data.english)}</span></a><div class="navright"><nav class="navlinks" aria-label="${B('主导航','Main navigation')}">${['home',...SECTIONS].map(id=>PUBLIC_HOME_ONLY&&id!=='home'?`<span class="navlabel" aria-disabled="true">${secName(id)}</span>`:`<a href="${id==='home'?'#':'#/'+id}"${id===cur?' aria-current="page"':''}>${secName(id)}</a>`).join('')}</nav><div class="langswitch" role="group" aria-label="语言 / Language"><button type="button" data-lang="zh" lang="zh-CN" aria-pressed="${lang==='zh'}" title="中文">中</button><button type="button" data-lang="en" lang="en" aria-pressed="${lang==='en'}" title="English">EN</button></div></div></header>`}

/* 切换语言：记住选择，去掉地址里的 lang 参数（否则刷新会回到参数指定的语言），并把焦点还给语言按钮。 */

/* ---------- 项目页：每个项目一个页面（地址为 #/p/项目编号） ---------- */
/* 页头只有标题、一句话和一行「我的工作」。有图示案例页的项目显示图示。带图片的项目依次是：主图、问题／设计决定／交付物、带图注的图、完整图版。 */
const boardsOf=p=>String(p.boards||'').split(/\r?\n/).map(l=>({src:l.trim(),cap:''})).filter(g=>isImg(g.src));
const picsOf=p=>[...galleryOf(p),...boardsOf(p)];
function projectMarkup(i){
  const p=data.projects[i],c=caseOf(p),sec=secOf(p),shots=c?[]:galleryOf(p),boards=c?[]:boardsOf(p),links=linksOf(p),pics=shots.length+boards.length;
  const peers=inSection(sec).filter(j=>j===i||hasPage(data.projects[j])),at=peers.indexOf(i),prev=peers[(at+peers.length-1)%peers.length],next=peers[(at+1)%peers.length];
  const block=(h,t)=>t?`<section class="pp-sec"><h2>${h}</h2><p>${esc(t)}</p></section>`:'';
  const linkrow=links.length?`<p class="pp-links">${links.map(l=>`<a target="_blank" rel="noopener noreferrer" href="${esc(l.url)}">${esc(l.name||B('相关链接','Link'))}${arw('ur')}</a>`).join('')}</p>`:'';
  /* 迭代 059：页头是一张封面。眉题只放项目性质；类别、时间、我的工作、链接收进标题下面的信息栏（一条细线，下面一行小标签一行内容）。内容与原来相同，只是换了位置。 */
  const spec=[[B('类别','Category'),esc(L(p,'category'))],[B('时间','Date'),esc(p.date||''),'sp-date'],[B('我的工作','My work'),!c&&pics?esc(L(p,'role')):'','sp-work'],[B('链接','Links'),!c&&pics?linkrow:'','sp-links']].filter(x=>x[1]);
  const head=(!c&&L(p,'summary')?`<p class="pp-lead">${esc(L(p,'summary'))}</p>`:'')
    +(spec.length?`<dl class="pp-spec">${spec.map(([t,v,c])=>`<div${c?` class="${c}"`:''}><dt>${t}</dt><dd>${v}</dd></div>`).join('')}</dl>`:'');
  const fig=(g,k,src,tag)=>`<figure class="shot"><button type="button" data-shot="${k}" aria-label="${esc(B('查看大图','View larger')+' '+(k+1)+' / '+pics)}"><img loading="${k<2?'eager':'lazy'}" src="${esc(src)}" alt="${esc(bi(g.cap)||L(p,'title')+' '+(k+1))}"></button>${g.cap||tag?`<figcaption>${tag?`<span class="shotno">${tag}</span>`:''}${esc(bi(g.cap))}</figcaption>`:''}</figure>`;
  const facts=[[B('问题','Problem'),L(p,'question')],[B('方案','Approach'),L(p,'approach')],[B('结果与产出','Results & outputs'),L(p,'evidence')]].filter(f=>f[1]);
  /* 迭代 026：不再区分 layout，有图的项目一律第一张作主图；其余为方案过程图，并排横向滑动；完整图版纵向排列。 */
  /* 迭代 059：过程图多于 3 张时横向滑动（带左右按钮）；3 张以内不滑动，并排铺满一行（class fit，宽度按各图宽高比分配，见 render）。有图注的过程图带编号；完整图版放在浅色带上，每张标「图版 01 / 04」。 */
  const hero=shots.length>0,rest=shots.length-1,slide=rest>3;
  const body=c?`<section class="case-summary" aria-label="${B('项目概览','Project summary')}">${[[B('问题','Problem'),L(p,'question')],[B('我的工作','My work'),L(p,'role')],[B('方案','Approach'),L(p,'approach')],[B('结果与状态','Results & status'),L(p,'evidence')]].filter(x=>x[1]).map(([label,value])=>`<div><h2>${label}</h2><p>${esc(value)}</p></div>`).join('')}</section>`+c.render(p)
    :pics?(hero?`<div class="pp-hero">${fig(shots[0],0,shots[0].src)}</div>`:'')
      +(facts.length?`<div class="pp-facts">${facts.map(([h,x])=>`<section><h2>${h}</h2><p>${esc(x)}</p></section>`).join('')}</div>`:'')
      +(rest>0?`<section class="stripsec"><div class="pp-subrow"><h2 class="pp-sub">${B('过程与细节','Process & details')}<span>${rest}</span></h2>${slide?`<div class="stripctl"><button type="button" data-strip="-1" aria-label="${B('向左滑动','Scroll left')}">${arw('l',1)}</button><button type="button" data-strip="1" aria-label="${B('向右滑动','Scroll right')}">${arw('r',1)}</button></div>`:''}</div>${slide?`<div class="strip" tabindex="0" role="region" aria-label="${B('过程与细节，可左右滑动','Process & details, scrolls sideways')}">`:`<div class="strip fit" data-n="${rest}">`}${shots.map((g,k)=>k===0?'':fig(g,k,rest>2?thumbOf(g.src):g.src,g.cap?nn(k-1):'')).join('')}</div></section>`:'')
      +(boards.length?`<section class="platesec"><h2 class="pp-sub">${B('完整图版','Complete boards')}<span>${boards.length}</span></h2><div class="shots rows">${boards.map((g,k)=>fig(g,shots.length+k,g.src,boards.length>1?`${B('图版','Board')} ${nn(k)} / ${nn(boards.length-1)}`:'')).join('')}</div></section>`:'')
    :`<div class="pp-cover projectvisual">${cover(p,i)}</div><div class="pp-grid">${block(B('问题','Problem'),L(p,'question'))}${block(B('我的工作','My work'),L(p,'role'))}${block(B('方案','Approach'),L(p,'approach'))}${block(B('结果与产出','Results & outputs'),L(p,'evidence'))}</div>${linkrow}`;
  return `<div class="wrap">${navMarkup(CASES.portfolio?.navFor(p)||sec)}<main class="ppage" id="main"><div class="pp-top band"><a class="pp-back" href="#/${CASES.portfolio?.navFor(p)||sec}">${arw('l')}${secName(CASES.portfolio?.navFor(p)||sec)}</a>`
  +`<header class="pp-head">${L(p,'status')?`<div class="pp-meta"><span class="status">${esc(L(p,'status'))}</span></div>`:''}<h1 id="pp-title" tabindex="-1">${esc(L(p,'title'))}</h1>${head}</header></div>`
  +body
  +(peers.length>1?`<nav class="pp-nav" aria-label="${B('相关项目','Related projects')}">${peers.length>2?`<a href="${href(prev)}"><small>${arw('l')}${B('上一个','Previous')}</small>${esc(L(data.projects[prev],'title'))}</a>`:'<span></span>'}<a href="${href(next)}"><small>${B('下一个','Next')}${arw('r')}</small>${esc(L(data.projects[next],'title'))}</a></nav>`:'')
  +`</main>${footerMarkup()}</div>`;
}

/* 地址里的项目已经不在目录里（被删除，或编号写错）：说明情况并给出回到目录的入口，不指向别的项目。 */
function missingMarkup(){
  /* 迭代 059：做成一个完整的空状态——一张空着的“方与圆”量图（呼应首页的人体手稿，这里没有人物）、标题、一句说明，和三个回到目录的入口。 */
